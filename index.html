const GRADES={"2":[{"title":"The Garden Checkup","pages":[[{"type":"plain","text":"Room 8 visits the school garden every Friday to see what has changed."},{"type":"choice","prefix":"Maya carries a notebook so she can ","correct":"record","tail":" what the class observes.","options":["record","erase","hide"]},{"type":"choice","prefix":"The tomato plants ","correct":"are","tail":" taller than they were last week.","options":["are","was","is"]},{"type":"plain","text":"Several yellow flowers have opened near the green stems."},{"type":"plain","text":"Behind one flower, Maya notices a tiny green tomato beginning to grow."},{"type":"choice","prefix":"She sketches the new fruit and writes the ","correct":"date","tail":" beside her drawing.","options":["name","date","color"]}],[{"type":"choice","prefix":"Mr. Lee asks the students to look ","correct":"closely","tail":" at the tomato flowers without picking them.","options":["quickly","quietly","closely"]},{"type":"choice","prefix":"","correct":"He","tail":" explains that tomato flowers must be pollinated before fruit can fully develop.","options":["It","They","He"]},{"type":"plain","text":"Wind can move tomato pollen, and bumblebees can help by shaking pollen loose."},{"type":"plain","text":"Ben finds another tiny tomato hidden beneath a wide leaf."},{"type":"plain","text":"He points to it so Maya can add the discovery to her notes."},{"type":"choice","prefix":"The class wonders how much ","correct":"larger","tail":" both tomatoes will be next week.","options":["softer","larger","greener"]}],[{"type":"choice","prefix":"Next, the students ","correct":"move","tail":" to the row of bean plants.","options":["move","return","point"]},{"type":"plain","text":"Long green pods hang from vines that curl around their supports."},{"type":"choice","prefix":"Some pods are still small, while others look large enough to ","correct":"harvest","tail":".","options":["water","harvest","plant"]},{"type":"plain","text":"Mr. Lee opens one mature pod so the class can see the smooth beans inside."},{"type":"plain","text":"The students compare the young pods with the mature one."},{"type":"choice","prefix":"","correct":"They","tail":" notice that the beans inside have grown as the pod became larger.","options":["It","She","They"]}],[{"type":"choice","prefix":"Near the lettuce bed, Maya spots a plant with ","correct":"drooping","tail":" leaves.","options":["spotted","shining","drooping"]},{"type":"choice","prefix":"She touches the soil beside it and finds that the ground feels ","correct":"dry","tail":".","options":["soft","dry","warm"]},{"type":"plain","text":"Mr. Lee reminds the class that plants need the right amount of water to grow."},{"type":"choice","prefix":"Maya fills a watering can and pours ","correct":"slowly","tail":" around the base of the lettuce.","options":["slowly","lightly","deeply"]},{"type":"plain","text":"She avoids splashing the leaves and gives the water time to soak into the soil."},{"type":"plain","text":"The class decides to check the lettuce again before leaving the garden."}],[{"type":"plain","text":"Ben suddenly points to a red ladybug crawling across a tomato leaf."},{"type":"plain","text":"The students gather nearby, but they leave enough space so they do not disturb it."},{"type":"choice","prefix":"Mr. Lee explains that ladybugs can ","correct":"eat","tail":" aphids and other small insects that feed on plants.","options":["watch","eat","find"]},{"type":"choice","prefix":"","correct":"That","tail":" means a ladybug can sometimes be a helpful garden visitor.","options":["That","She","They"]},{"type":"plain","text":"Maya draws the spotted insect beside her tomato notes."},{"type":"choice","prefix":"She writes that not every insect found in a garden is ","correct":"harmful","tail":".","options":["colorful","hungry","harmful"]}],[{"type":"choice","prefix":"The class walks to the carrot bed, where only feathery green tops show ","correct":"above","tail":" the soil.","options":["under","above","through"]},{"type":"plain","text":"Maya wonders how anyone can tell when a carrot is ready to harvest."},{"type":"choice","prefix":"Mr. Lee gently brushes soil ","correct":"away","tail":" from the top of one carrot.","options":["around","away","under"]},{"type":"plain","text":"A thick orange shoulder appears just below the leaves."},{"type":"plain","text":"He explains that checking the top can give gardeners a clue about the carrot's size."},{"type":"choice","prefix":"","correct":"The students","tail":" choose that carrot for today's harvest.","options":["It","He","The students"]}],[{"type":"choice","prefix":"Mr. Lee loosens the soil so the carrot will be ","correct":"easier","tail":" to pull.","options":["easier","faster","harder"]},{"type":"choice","prefix":"Maya holds the leafy top and ","correct":"gently","tail":" lifts the carrot from the ground.","options":["firmly","quickly","gently"]},{"type":"choice","prefix":"The orange root ","correct":"is","tail":" long, crooked, and covered with dark soil.","options":["are","was","is"]},{"type":"plain","text":"Everyone laughs when Maya says it looks like a wiggly orange leg."},{"type":"plain","text":"The class places the carrot in a harvest basket with several ripe bean pods."},{"type":"plain","text":"They leave the smaller vegetables in the garden so those plants can keep growing."}],[{"type":"choice","prefix":"Before going inside, the students pull a few ","correct":"small","tail":" weeds near the vegetable rows.","options":["tall","deep","small"]},{"type":"choice","prefix":"Weeds can ","correct":"compete","tail":" with garden plants for water, light, and space.","options":["prepare","compete","remain"]},{"type":"choice","prefix":"","correct":"The class","tail":" works carefully so they do not pull the vegetables by mistake.","options":["It","The class","They"]},{"type":"plain","text":"Then Maya returns to the lettuce plant that she watered earlier."},{"type":"plain","text":"Its leaves are still soft, but they are not hanging as low as before."},{"type":"plain","text":"Maya records the change instead of deciding too quickly that the plant is completely better."}],[{"type":"choice","prefix":"Back in the classroom, Maya ","correct":"opens","tail":" her science notebook to a clean page.","options":["opens","closes","carries"]},{"type":"plain","text":"She writes about the tomato fruit, bean pods, dry soil, ladybug, and carrot."},{"type":"choice","prefix":"Her drawings help her ","correct":"remember","tail":" details that might otherwise be forgotten.","options":["change","remember","measure"]},{"type":"plain","text":"Ben compares this week's notes with the notes from their last garden visit."},{"type":"plain","text":"The class can now see several changes that happened over only seven days."},{"type":"choice","prefix":"The notebook has ","correct":"become","tail":" a record of how the garden changes over time.","options":["visit","become","carry"]}],[{"type":"plain","text":"Mr. Lee asks the class what today's garden checkup taught them."},{"type":"choice","prefix":"Maya says that careful observations ","correct":"can","tail":" reveal changes that are easy to miss.","options":["must","can","will"]},{"type":"plain","text":"Ben adds that plants need water, light, space, and other suitable conditions to grow."},{"type":"choice","prefix":"","correct":"The students","tail":" also learned that some insects can help garden plants.","options":["It","He","The students"]},{"type":"plain","text":"They plan to return next Friday and compare their new observations with today's notes."},{"type":"choice","prefix":"Maya closes her notebook, already ","correct":"wondering","tail":" what the garden will show them next.","options":["wondering","explaining","forgetting"]}]],"num":1},{"num":2,"title":"The Lost Library Card","pages":[[{"type":"plain","text":"Nora loved choosing books from the school library."},{"type":"choice","prefix":"On ","correct":"Tuesday","tail":", her class walked there after lunch.","options":["Tuesday","summer","midnight"]},{"type":"plain","text":"Nora picked a book about a small red fox."},{"type":"choice","prefix":"","correct":"She","tail":" carried it to the check-out desk.","options":["They","She","It"]},{"type":"plain","text":"Then she reached into her pocket for her library card."},{"type":"choice","prefix":"The pocket ","correct":"was","tail":" empty.","options":["were","are","was"]},{"type":"plain","text":"Nora checked the other pocket in her jacket."},{"type":"plain","text":"The card was not there either."},{"type":"choice","prefix":"","correct":"She","tail":" felt worried, but she did not rush.","options":["She","They","It"]},{"type":"choice","prefix":"Mrs. Lane, the ","correct":"librarian","tail":", told Nora to think back.","options":["coach","librarian","nurse"]},{"type":"plain","text":"Nora tried to remember when she had last used the card."},{"type":"choice","prefix":"","correct":"She","tail":" decided to look in a few likely places.","options":["They","It","She"]}],[{"type":"choice","prefix":"First, Nora went back to the reading ","correct":"rug","tail":".","options":["rug","sink","door"]},{"type":"plain","text":"She had sat there while she looked at books."},{"type":"choice","prefix":"Nora checked beside the rug and ","correct":"under","tail":" a low shelf.","options":["above","under","through"]},{"type":"choice","prefix":"","correct":"She","tail":" found a blue bookmark, but no library card.","options":["They","It","She"]},{"type":"plain","text":"Next, she walked to the table by the window."},{"type":"plain","text":"Two students were still reading there."},{"type":"choice","prefix":"Nora looked under her ","correct":"chair","tail":" and around the table legs.","options":["chair","window","book"]},{"type":"plain","text":"The floor was clear."},{"type":"choice","prefix":"Her friend Eli offered to ","correct":"help","tail":" with the search.","options":["hide","help","leave"]},{"type":"choice","prefix":"","correct":"He","tail":" asked what the card looked like.","options":["They","She","He"]},{"type":"plain","text":"Nora said it was white with her name across the front."},{"type":"plain","text":"Together, they kept looking."}],[{"type":"choice","prefix":"Nora remembered stopping at the animal-book ","correct":"shelf","tail":".","options":["shelf","playground","sink"]},{"type":"plain","text":"She and Eli walked to that part of the library."},{"type":"plain","text":"A book about bears was sticking out from the row."},{"type":"choice","prefix":"Nora gently pushed ","correct":"it","tail":" back into place.","options":["they","it","he"]},{"type":"choice","prefix":"Then ","correct":"she","tail":" saw a small white corner behind the books.","options":["they","it","she"]},{"type":"plain","text":"Her heart gave a happy jump."},{"type":"choice","prefix":"Nora reached behind the row and pulled out a ","correct":"card","tail":".","options":["card","book","coin"]},{"type":"choice","prefix":"It belonged to ","correct":"another","tail":" student.","options":["her","another","no"]},{"type":"plain","text":"She took the card to Mrs. Lane instead of leaving it there."},{"type":"plain","text":"Mrs. Lane thanked her for being helpful."},{"type":"plain","text":"Nora still needed to find her own card."},{"type":"choice","prefix":"She took a slow breath and thought ","correct":"again","tail":".","options":["never","outside","again"]}],[{"type":"choice","prefix":"Suddenly, Nora remembered using her card that ","correct":"morning","tail":".","options":["morning","winter","week"]},{"type":"plain","text":"Her teacher had asked students to bring their cards to class."},{"type":"choice","prefix":"Nora had placed hers on ","correct":"top","tail":" of her reading folder.","options":["side","top","back"]},{"type":"plain","text":"After reading time, she put the folder inside her desk."},{"type":"plain","text":"Nora and Eli returned to the classroom with permission."},{"type":"choice","prefix":"She opened her desk and moved a notebook ","correct":"aside","tail":".","options":["outside","upstairs","aside"]},{"type":"choice","prefix":"The reading folder was near the ","correct":"bottom","tail":".","options":["bottom","roof","front"]},{"type":"choice","prefix":"Nora lifted it and saw the ","correct":"missing","tail":" card underneath.","options":["broken","missing","new"]},{"type":"plain","text":"She smiled and showed it to Eli."},{"type":"plain","text":"The card had slipped off the folder when she put it away."},{"type":"choice","prefix":"Now the mystery made ","correct":"sense","tail":".","options":["color","noise","sense"]},{"type":"plain","text":"Nora hurried back to the library without running."}],[{"type":"choice","prefix":"Mrs. Lane checked out the ","correct":"fox","tail":" book for Nora.","options":["fox","space","cooking"]},{"type":"choice","prefix":"Nora placed the library card in a small ","correct":"holder","tail":" inside her backpack.","options":["puddle","holder","garden"]},{"type":"choice","prefix":"She wanted to keep it in the same ","correct":"safe","tail":" spot each day.","options":["open","loud","safe"]},{"type":"plain","text":"Eli said that was a good plan."},{"type":"plain","text":"Before class left, Nora returned the other student's card to Mrs. Lane."},{"type":"choice","prefix":"The librarian promised to help find its ","correct":"owner","tail":".","options":["owner","reader","window"]},{"type":"plain","text":"Nora was glad she had kept searching carefully."},{"type":"choice","prefix":"She had solved the problem by thinking about her ","correct":"steps","tail":".","options":["colors","steps","sounds"]},{"type":"plain","text":"The lost card had not been far away."},{"type":"plain","text":"It was simply in a place Nora had forgotten to check."},{"type":"plain","text":"Nora held her new book against her chest."},{"type":"choice","prefix":"She was ready to start reading it back in ","correct":"class","tail":".","options":["home","park","class"]}]]},{"num":3,"title":"A Home for the Class Fish","pages":[[{"type":"choice","prefix":"Ms. Park's class ","correct":"was","tail":" getting a small fish for the room.","options":["was","were","are"]},{"type":"plain","text":"Before it arrived, the students had work to do."},{"type":"choice","prefix":"","correct":"They","tail":" needed to prepare a safe home for it.","options":["It","They","She"]},{"type":"plain","text":"Ms. Park showed the class an empty fish tank."},{"type":"choice","prefix":"The tank looked ","correct":"plain","tail":" without water or rocks.","options":["bright","full","plain"]},{"type":"plain","text":"She asked what a fish would need to live there."},{"type":"choice","prefix":"Students shared ","correct":"ideas","tail":" one at a time.","options":["ideas","questions","turns"]},{"type":"plain","text":"Some ideas were useful, and others needed more thought."},{"type":"plain","text":"The class made a list on chart paper."},{"type":"choice","prefix":"","correct":"They","tail":" wrote clean water, food, space, and a safe tank.","options":["It","They","She"]},{"type":"plain","text":"Ms. Park said they would learn before making choices."},{"type":"choice","prefix":"The fish ","correct":"would","tail":" depend on them for careful care.","options":["was","has","would"]}],[{"type":"choice","prefix":"The next day, the class added clean ","correct":"gravel","tail":" to the tank.","options":["gravel","paper","cloth"]},{"type":"choice","prefix":"","correct":"They","tail":" rinsed the gravel first so the water would stay clear.","options":["It","They","She"]},{"type":"plain","text":"Ms. Park slowly poured water into the tank."},{"type":"choice","prefix":"The students watched tiny ","correct":"bubbles","tail":" rise to the top.","options":["crumbs","leaves","bubbles"]},{"type":"plain","text":"A filter was placed along one side."},{"type":"choice","prefix":"It would help keep the water ","correct":"cleaner","tail":".","options":["cleaner","louder","warmer"]},{"type":"plain","text":"The class also added a small plant made for fish tanks."},{"type":"plain","text":"It gave the fish another place to swim around."},{"type":"choice","prefix":"No one tapped on the ","correct":"glass","tail":".","options":["floor","glass","plant"]},{"type":"choice","prefix":"Ms. Park explained that sudden ","correct":"noise","tail":" could bother a fish.","options":["water","light","noise"]},{"type":"plain","text":"The students practiced looking without touching."},{"type":"plain","text":"The tank was beginning to look ready."}],[{"type":"choice","prefix":"On ","correct":"Friday","tail":", the fish finally arrived.","options":["Friday","winter","night"]},{"type":"choice","prefix":"It was small, orange, and ","correct":"quick","tail":".","options":["still","quick","sleepy"]},{"type":"choice","prefix":"Ms. Park did not drop it ","correct":"straight","tail":" into the new tank.","options":["quietly","slowly","straight"]},{"type":"plain","text":"The fish came in a bag with water from its old home."},{"type":"choice","prefix":"She let the closed bag ","correct":"rest","tail":" in the tank for a while.","options":["rest","jump","spin"]},{"type":"plain","text":"This helped the water in the bag slowly match the tank temperature."},{"type":"plain","text":"The class waited quietly."},{"type":"choice","prefix":"Soon, Ms. Park ","correct":"carefully","tail":" moved the fish into its new home.","options":["roughly","carefully","carelessly"]},{"type":"choice","prefix":"","correct":"It","tail":" swam behind the plant at first.","options":["They","He","It"]},{"type":"plain","text":"Then it came out and crossed the tank."},{"type":"plain","text":"The students smiled as they watched."},{"type":"plain","text":"They named the fish Sunny."}],[{"type":"choice","prefix":"The class made a ","correct":"plan","tail":" for caring for Sunny.","options":["plan","song","picture"]},{"type":"choice","prefix":"Only a ","correct":"small","tail":" amount of food would be given at feeding time.","options":["huge","small","endless"]},{"type":"choice","prefix":"Too much food ","correct":"could","tail":" make the tank dirty.","options":["was","has","could"]},{"type":"plain","text":"Two students would check the tank each morning."},{"type":"choice","prefix":"They would make sure the filter was ","correct":"working","tail":".","options":["working","sleeping","missing"]},{"type":"plain","text":"They would also tell Ms. Park if the water looked cloudy."},{"type":"choice","prefix":"Students would ","correct":"never","tail":" put pencils, fingers, or toys in the tank.","options":["often","never","always"]},{"type":"plain","text":"Sunny needed a calm and clean home."},{"type":"choice","prefix":"The jobs changed each week so ","correct":"everyone","tail":" could help.","options":["Sunny","nobody","everyone"]},{"type":"plain","text":"A chart showed whose turn it was."},{"type":"plain","text":"The class learned that a pet was more than something to watch."},{"type":"plain","text":"Caring for it meant doing the right jobs every day."}],[{"type":"choice","prefix":"After several weeks, Sunny was doing ","correct":"well","tail":".","options":["well","poorly","away"]},{"type":"plain","text":"The students had learned to follow the care plan."},{"type":"choice","prefix":"They watched how the fish moved during ","correct":"different","tail":" parts of the day.","options":["same","different","empty"]},{"type":"choice","prefix":"Sometimes Sunny ","correct":"rested","tail":" near the plant.","options":["climbed","flew","rested"]},{"type":"plain","text":"At other times, it swam quickly across the tank."},{"type":"choice","prefix":"The class wrote short ","correct":"notes","tail":" about what they noticed.","options":["notes","lists","stories"]},{"type":"plain","text":"They did not guess what Sunny was thinking."},{"type":"choice","prefix":"Instead, they wrote only what they could ","correct":"see","tail":".","options":["guess","see","invent"]},{"type":"plain","text":"Ms. Park praised them for being careful observers."},{"type":"plain","text":"The tank had become part of their science learning."},{"type":"choice","prefix":"","correct":"It","tail":" also reminded them that living things have needs.","options":["They","He","It"]},{"type":"plain","text":"The class was proud to care for Sunny together."}]]},{"num":4,"title":"Why Leaves Change","pages":[[{"type":"choice","prefix":"In early ","correct":"fall","tail":", Sam noticed the tree outside his window.","options":["fall","summer","noon"]},{"type":"plain","text":"Most of its leaves were still green."},{"type":"choice","prefix":"A few leaves ","correct":"had","tail":" turned yellow near the top.","options":["has","had","have"]},{"type":"choice","prefix":"Sam wondered why the colors ","correct":"were","tail":" changing.","options":["was","is","were"]},{"type":"plain","text":"At school, his class was studying signs of fall."},{"type":"choice","prefix":"Their teacher, Mr. Reed, brought in several ","correct":"fallen","tail":" leaves.","options":["fallen","plastic","painted"]},{"type":"plain","text":"The leaves were red, yellow, orange, and brown."},{"type":"plain","text":"He asked the class to look closely at them."},{"type":"choice","prefix":"Sam noticed that the leaves ","correct":"had","tail":" many different shapes.","options":["has","had","have"]},{"type":"plain","text":"He also saw thin lines running through each leaf."},{"type":"plain","text":"The class began a list of questions."},{"type":"choice","prefix":"Sam wrote, ","correct":"Why","tail":" do green leaves change color?","options":["Who","Where","Why"]}],[{"type":"choice","prefix":"Mr. Reed explained that leaves use ","correct":"sunlight","tail":" to help make food for a tree.","options":["sunlight","rain","soil"]},{"type":"plain","text":"A green material in leaves helps with this job."},{"type":"choice","prefix":"During ","correct":"spring","tail":" and summer, trees get many hours of sunlight.","options":["night","spring","winter"]},{"type":"plain","text":"The green color is easy to see during those months."},{"type":"choice","prefix":"In fall, the days become ","correct":"shorter","tail":".","options":["brighter","longer","shorter"]},{"type":"plain","text":"Many places also become cooler."},{"type":"choice","prefix":"Some trees begin to ","correct":"stop","tail":" making as much of the green material.","options":["stop","start","double"]},{"type":"choice","prefix":"As the green color fades, other colors ","correct":"can","tail":" become easier to see.","options":["is","can","has"]},{"type":"plain","text":"Yellow and orange colors may appear in the leaves."},{"type":"plain","text":"Weather can affect how bright some colors look."},{"type":"plain","text":"Different kinds of trees may change in different ways."},{"type":"choice","prefix":"Sam ","correct":"was","tail":" surprised that some colors had been there all along.","options":["were","are","was"]}],[{"type":"choice","prefix":"The class went outside to ","correct":"observe","tail":" trees near the playground.","options":["observe","paint","move"]},{"type":"plain","text":"They carried clipboards and pencils."},{"type":"choice","prefix":"Mr. Reed reminded them to collect only leaves already on the ","correct":"ground","tail":".","options":["branch","ground","desk"]},{"type":"choice","prefix":"Sam found a yellow leaf beside a ","correct":"maple","tail":" tree.","options":["grass","pinecone","maple"]},{"type":"plain","text":"His partner found a green leaf with one red edge."},{"type":"choice","prefix":"","correct":"They","tail":" compared the two leaves.","options":["They","It","She"]},{"type":"plain","text":"Both had similar shapes, but their colors were different."},{"type":"choice","prefix":"The students drew what ","correct":"they","tail":" saw.","options":["it","they","she"]},{"type":"plain","text":"They also wrote the date beside each drawing."},{"type":"choice","prefix":"Mr. Reed said dates ","correct":"could","tail":" help them notice c },{"type":"choice","prefix":"Dr. Park compared ","correct":"his","tail":" handwriting with the labels on the map.","options":["their","his","our"]},{"type":"choice","prefix":"Some letters looked similar, especially the unusual way ","correct":"he","tail":" formed capital M.","options":["they","it","he"]},{"type":"choice","prefix":"Other letters ","correct":"were","tail":" less certain.","options":["were","was","is"]},{"type":"choice","prefix":"","correct":"She","tail":" refused to identify Reed as the mapmaker based on one resemblance.","options":["They","She","It"]},{"type":"choice","prefix":"Instead, she ","correct":"contacted","tail":" an archive that held more of his records.","options":["different","ordinary","contacted"]},{"type":"plain","text":"The archive sent digital copies of two survey maps signed by Reed."},{"type":"choice","prefix":"Those maps used several ","correct":"symbols","tail":" that also appeared on the museum map.","options":["symbols","sounds","colors"]},{"type":"plain","text":"A small triangle marked hills, and dotted lines represented unpaved roads."},{"type":"plain","text":"The similarities made Reed a stronger possibility."},{"type":"plain","text":"Still, Dr. Park described the conclusion as likely rather than proven."},{"type":"plain","text":"Careful historians distinguish strong evidence from absolute certainty."}],[{"type":"plain","text":"Another clue came from a note written along the map's lower edge."},{"type":"choice","prefix":"The ","correct":"faded","tail":" sentence mentioned a proposed road to the western farms.","options":["faded","bright","fresh"]},{"type":"plain","text":"Town records showed that officials debated such a road in 1897."},{"type":"choice","prefix":"The road ","correct":"was","tail":" approved the following year.","options":["were","are","was"]},{"type":"choice","prefix":"On the old map, the route ","correct":"was","tail":" drawn with a thin dashed line.","options":["was","were","are"]},{"type":"choice","prefix":"That ","correct":"suggested","tail":" the map may have been created while the road was still being planned.","options":["different","ordinary","suggested"]},{"type":"choice","prefix":"Dr. Park combined ","correct":"this","tail":" clue with the newspaper article and survey symbols.","options":["these","this","those"]},{"type":"plain","text":"Together, the sources pointed to the late 1890s."},{"type":"plain","text":"Museum workers created a protective sleeve for the document."},{"type":"choice","prefix":"","correct":"They","tail":" also recorded exactly where it had been found.","options":["It","She","They"]},{"type":"plain","text":"The location beneath the floorboards might eventually provide another clue."},{"type":"plain","text":"For now, the map's history was becoming clearer."}],[{"type":"plain","text":"The museum displayed a digital copy instead of the fragile original."},{"type":"choice","prefix":"Visitors ","correct":"could","tail":" compare the historic map with a current map on a large screen.","options":["could","was","has"]},{"type":"plain","text":"Dr. Park wrote a label explaining what researchers knew and what remained uncertain."},{"type":"choice","prefix":"","correct":"She","tail":" identified Samuel Reed as a possible mapmaker, not a confirmed one.","options":["They","She","It"]},{"type":"choice","prefix":"","correct":"She","tail":" also described how the proposed road helped date the document.","options":["They","It","She"]},{"type":"choice","prefix":"Students from a nearby school visited the exhibit the ","correct":"following","tail":" week.","options":["different","ordinary","following"]},{"type":"choice","prefix":"They ","correct":"were","tail":" surprised that one sheet of paper required so much investigation.","options":["were","was","is"]},{"type":"choice","prefix":"Dr. Park told them that historical ","correct":"research","tail":" often works that way.","options":["research","recess","music"]},{"type":"plain","text":"Researchers compare sources, test ideas, and revise conclusions when new evidence appears."},{"type":"plain","text":"The old map did not reveal every secret hidden beneath the museum floor."},{"type":"plain","text":"It did reveal how much a community can change over time."},{"type":"plain","text":"For the students, the mystery became a lesson in using evidence carefully."}]]},{"num":3,"title":"Why the Canyon Echoes","pages":[[{"type":"plain","text":"On a field trip, Jamal's class hiked to an overlook above a narrow canyon."},{"type":"choice","prefix":"","correct":"Their","tail":" guide asked everyone to stop at a marked viewing area.","options":["Their","His","Our"]},{"type":"plain","text":"Across the canyon, steep rock walls rose above the river."},{"type":"choice","prefix":"Jamal heard a raven call from ","correct":"somewhere","tail":" below.","options":["different","somewhere","ordinary"]},{"type":"plain","text":"A moment later, a faint version of the sound seemed to return."},{"type":"choice","prefix":"Several students wondered whether another raven ","correct":"had","tail":" answered.","options":["has","had","have"]},{"type":"plain","text":"The guide, Ms. Ortega, suggested listening again before deciding."},{"type":"choice","prefix":"","correct":"She","tail":" clapped once and waited.","options":["They","It","She"]},{"type":"choice","prefix":"A softer clap reached ","correct":"them","tail":" a short time later.","options":["them","him","her"]},{"type":"choice","prefix":"Jamal recognized the returning sound as an ","correct":"echo","tail":".","options":["shadow","echo","signal"]},{"type":"plain","text":"The class wanted to understand why the canyon made it easy to hear."},{"type":"plain","text":"Ms. Ortega said the answer involved the way sound travels."}],[{"type":"plain","text":"Sound begins when something vibrates and causes nearby matter to vibrate."},{"type":"choice","prefix":"","correct":"Those","tail":" vibrations can travel through air as sound waves.","options":["This","Those","These"]},{"type":"choice","prefix":"When sound waves reach a surface, some of ","correct":"their","tail":" energy can reflect.","options":["his","our","their"]},{"type":"choice","prefix":"A hard rock wall ","correct":"can","tail":" reflect more sound than a soft, uneven surface.","options":["can","is","has"]},{"type":"plain","text":"The canyon wall stood far enough away for the reflected sound to arrive slightly later."},{"type":"plain","text":"That delay allowed the class to hear the reflection as a separate echo."},{"type":"choice","prefix":"Jamal noticed that his normal speaking voice ","correct":"did","tail":" not produce an obvious echo.","options":["does","did","do"]},{"type":"choice","prefix":"Ms. Ortega explained that volume, distance, and surrounding noise ","correct":"can","tail":" affect what people hear.","options":["can","is","has"]},{"type":"plain","text":"The class tested several safe sounds from the viewing area."},{"type":"choice","prefix":"A single clap was easier to compare than a long ","correct":"sentence","tail":".","options":["different","sentence","ordinary"]},{"type":"plain","text":"Each test produced a faint return."},{"type":"plain","text":"The pattern supported the idea that sound was reflecting from the canyon walls."}],[{"type":"plain","text":"Back at school, the class built a simple model to explore reflection."},{"type":"choice","prefix":"","correct":"They","tail":" could not create a real canyon inside the classroom.","options":["It","She","They"]},{"type":"choice","prefix":"Instead, ","correct":"they","tail":" compared how sound behaved near different materials.","options":["they","it","she"]},{"type":"choice","prefix":"One group held a smooth board several feet from a ","correct":"ticking","tail":" device.","options":["different","ticking","ordinary"]},{"type":"plain","text":"Another placed a thick folded blanket in the same position."},{"type":"choice","prefix":"Students ","correct":"listened","tail":" from a marked spot and recorded what they noticed.","options":["different","ordinary","listened"]},{"type":"plain","text":"The board seemed to return more of the sound toward them."},{"type":"plain","text":"The blanket absorbed more sound and produced less noticeable reflection."},{"type":"choice","prefix":"Their model ","correct":"was","tail":" limited because the classroom was much smaller than a canyon.","options":["were","was","are"]},{"type":"plain","text":"Other walls and objects also reflected sound."},{"type":"plain","text":"Still, the comparison helped illustrate why surfaces matter."},{"type":"choice","prefix":"Models ","correct":"can","tail":" clarify one part of a process without copying every detail.","options":["is","has","can"]}],[{"type":"choice","prefix":"Jamal then wondered why every canyon ","correct":"does","tail":" not create the same echo.","options":["does","do","did"]},{"type":"choice","prefix":"The class researched how ","correct":"distance","tail":" and shape affect reflected sound.","options":["distance","temperature","weight"]},{"type":"choice","prefix":"If a wall ","correct":"is","tail":" too close, the reflection may blend with the original sound.","options":["are","is","were"]},{"type":"choice","prefix":"If surfaces are ","correct":"irregular","tail":", reflected waves can scatter in many directions.","options":["smooth","irregular","level"]},{"type":"plain","text":"Wind and background noise can also make an echo harder to notice."},{"type":"plain","text":"A wide open space may not return enough sound to the listener."},{"type":"plain","text":"The class realized that several conditions work together."},{"type":"choice","prefix":"The steep walls at ","correct":"their","tail":" field-trip site created useful reflecting surfaces.","options":["his","our","their"]},{"type":"plain","text":"The distance across the canyon also produced a noticeable delay."},{"type":"choice","prefix":"That combination helped explain what ","correct":"they","tail":" had heard.","options":["they","it","she"]},{"type":"plain","text":"Jamal added a diagram showing sound traveling outward and returning."},{"type":"plain","text":"Arrows made the path of the reflected sound easier to visualize."}],[{"type":"plain","text":"For the final assignment, students wrote explanations of the canyon echo."},{"type":"choice","prefix":"Jamal began with the raven call that had first caught ","correct":"his","tail":" attention.","options":["their","his","our"]},{"type":"choice","prefix":"Then ","correct":"he","tail":" described sound waves traveling through air and reflecting from rock.","options":["they","it","he"]},{"type":"plain","text":"He included the importance of distance between the listener and the wall."},{"type":"plain","text":"He also noted that not all surfaces reflect sound equally well."},{"type":"choice","prefix":"Ms. Ortega's field demonstration ","correct":"had","tail":" given the class an observation.","options":["had","has","have"]},{"type":"plain","text":"Their classroom model and research helped explain that observation."},{"type":"choice","prefix":"Jamal avoided writing that the ","correct":"canyon","tail":" “made” a new sound.","options":["canyon","meadow","harbor"]},{"type":"choice","prefix":"The echo ","correct":"was","tail":" a reflected version of the original sound.","options":["were","was","are"]},{"type":"choice","prefix":"His explanation connected ","correct":"evidence","tail":" from several activities.","options":["opinion","evidence","decoration"]},{"type":"plain","text":"The next time Jamal heard an echo, he knew what questions to ask."},{"type":"plain","text":"A familiar sound had become an example of wave behavior."}]]},{"num":4,"title":"The Vote That Changed the Playground","pages":[[{"type":"choice","prefix":"Students at Pine Ridge School ","correct":"had","tail":" asked for more shade on the playground.","options":["has","had","have"]},{"type":"choice","prefix":"During warm months, the blacktop became ","correct":"uncomfortable","tail":" in the afternoon.","options":["uncomfortable","different","ordinary"]},{"type":"plain","text":"The student council collected comments from classes in grades three through five."},{"type":"choice","prefix":"Some students ","correct":"suggested","tail":" planting trees.","options":["different","suggested","ordinary"]},{"type":"plain","text":"Others wanted a large fabric shade structure."},{"type":"plain","text":"A few proposed moving recess to a different part of the campus."},{"type":"choice","prefix":"Principal Harris explained that each option ","correct":"had","tail":" advantages and limits.","options":["has","have","had"]},{"type":"choice","prefix":"Trees ","correct":"would","tail":" take years to provide broad shade.","options":["would","was","has"]},{"type":"plain","text":"A structure could work sooner but would cost more money."},{"type":"plain","text":"Moving recess might create conflicts with other classes using the field."},{"type":"plain","text":"The student council decided to study the choices before making a recommendation."},{"type":"choice","prefix":"","correct":"Their","tail":" goal was to support a decision with evidence.","options":["His","Their","Our"]}],[{"type":"plain","text":"Council members began by surveying students and staff."},{"type":"choice","prefix":"","correct":"They","tail":" asked which playground areas became hottest and when.","options":["It","She","They"]},{"type":"choice","prefix":"","correct":"They","tail":" also measured surface temperatures with an adult supervising the equipment.","options":["They","It","She"]},{"type":"choice","prefix":"The center of the blacktop ","correct":"was","tail":" hottest during their afternoon measurements.","options":["were","was","are"]},{"type":"choice","prefix":"Areas near the building ","correct":"were","tail":" cooler when shadows reached them.","options":["was","is","were"]},{"type":"plain","text":"The council recorded the data instead of relying only on opinions."},{"type":"choice","prefix":"Next, ","correct":"they","tail":" met with the district grounds manager.","options":["they","it","she"]},{"type":"plain","text":"She explained where underground pipes made tree planting difficult."},{"type":"plain","text":"She also identified two areas where new trees could grow safely."},{"type":"choice","prefix":"The facilities director provided an estimated cost for a ","correct":"shade","tail":" structure.","options":["traffic","shade","rainfall"]},{"type":"plain","text":"Now the council had information about preference, location, and cost."},{"type":"plain","text":"The decision had become more complicated, but also better informed."}],[{"type":"plain","text":"The council prepared three proposals for a schoolwide advisory vote."},{"type":"choice","prefix":"The first focused on ","correct":"planting","tail":" several trees.","options":["planting","different","ordinary"]},{"type":"plain","text":"The second recommended one large shade structure."},{"type":"choice","prefix":"The third ","correct":"combined","tail":" fewer trees with a smaller structure.","options":["separate","combined","hidden"]},{"type":"plain","text":"Before voting, students read a summary of the evidence for each option."},{"type":"choice","prefix":"The ballot asked which proposal ","correct":"they","tail":" preferred.","options":["they","it","she"]},{"type":"choice","prefix":"Teachers reminded students that the vote ","correct":"would","tail":" guide the recommendation.","options":["was","would","has"]},{"type":"choice","prefix":"","correct":"It","tail":" would not automatically approve construction.","options":["They","He","It"]},{"type":"plain","text":"The combined plan received the most votes."},{"type":"plain","text":"However, nearly one third of voters preferred the tree-only plan."},{"type":"plain","text":"Council members included that result in their report."},{"type":"choice","prefix":"They wanted school leaders to understand the range of opinions. A vote provided useful information, but it ","correct":"was","tail":" not the only factor.","options":["was","were","are"]}],[{"type":"plain","text":"Principal Harris reviewed the report with district staff."},{"type":"choice","prefix":"","correct":"They","tail":" agreed that the combined plan addressed several concerns.","options":["It","They","She"]},{"type":"choice","prefix":"Two trees ","correct":"could","tail":" be planted in safe locations that spring.","options":["was","has","could"]},{"type":"choice","prefix":"A smaller shade structure ","correct":"could","tail":" cover part of the blacktop sooner.","options":["could","was","has"]},{"type":"plain","text":"The total cost still fit within the available improvement budget."},{"type":"choice","prefix":"Before final approval, an ","correct":"engineer","tail":" needed to inspect the proposed structure location.","options":["artist","driver","engineer"]},{"type":"choice","prefix":"The student council shared ","correct":"this","tail":" update with the school.","options":["these","this","those"]},{"type":"plain","text":"Some students were disappointed that construction could not begin immediately."},{"type":"plain","text":"Council members explained that safety checks were part of the process."},{"type":"choice","prefix":"The advisory vote had ","correct":"influenced","tail":" the plan without replacing adult responsibilities.","options":["ignored","influenced","erased"]},{"type":"plain","text":"Students saw how evidence and public input can shape a decision."},{"type":"plain","text":"They also saw why some decisions require several stages."}],[{"type":"choice","prefix":"By the next fall, the shade structure ","correct":"was","tail":" complete.","options":["were","are","was"]},{"type":"choice","prefix":"Two young trees grew near the edge of the ","correct":"playground","tail":".","options":["playground","different","ordinary"]},{"type":"choice","prefix":"","correct":"Their","tail":" branches were still small, but they would provide more shade over time.","options":["Their","His","Our"]},{"type":"choice","prefix":"The council compared the finished project with its original ","correct":"proposals","tail":".","options":["photographs","proposals","repairs"]},{"type":"choice","prefix":"The result ","correct":"was","tail":" closest to the combined option students had supported.","options":["were","was","are"]},{"type":"choice","prefix":"","correct":"It","tail":" also included adjustments made after the engineering review.","options":["They","He","It"]},{"type":"plain","text":"Principal Harris thanked the council for collecting clear information."},{"type":"plain","text":"The project had required surveys, measurements, discussion, voting, and expert review."},{"type":"plain","text":"No single step had determined the outcome by itself."},{"type":"plain","text":"Students had participated in a real example of community decision making."},{"type":"plain","text":"The playground looked different, but the larger lesson was about the process."},{"type":"plain","text":"Good decisions often depend on both participation and reliable evidence."}]]},{"num":5,"title":"The Case of the Cracked Sidewalk","pages":[[{"type":"plain","text":"A long crack appeared in the sidewalk beside Maple School during winter."},{"type":"choice","prefix":"By early spring, one section had risen higher than the pavement around ","correct":"it","tail":".","options":["they","he","it"]},{"type":"plain","text":"Students noticed the uneven surface while walking to the garden."},{"type":"choice","prefix":"","correct":"Their","tail":" science teacher, Mr. Chen, asked them not to touch or step on the damaged area.","options":["Their","His","Our"]},{"type":"choice","prefix":"The school ","correct":"had","tail":" already marked it with bright safety cones.","options":["has","had","have"]},{"type":"choice","prefix":"Mr. Chen wondered whether the class ","correct":"could","tail":" investigate possible causes without disturbing it.","options":["was","has","could"]},{"type":"plain","text":"Students listed several ideas."},{"type":"choice","prefix":"Tree roots might be ","correct":"pushing","tail":" from below.","options":["pushing","different","ordinary"]},{"type":"plain","text":"Freezing water might have affected the pavement."},{"type":"choice","prefix":"The soil beneath the ","correct":"sidewalk","tail":" might also have shifted.","options":["different","sidewalk","ordinary"]},{"type":"plain","text":"The class knew that more than one explanation was possible."},{"type":"plain","text":"They began by gathering observations."}],[{"type":"plain","text":"A mature maple tree grew several feet from the cracked section."},{"type":"choice","prefix":"One large root ","correct":"was","tail":" visible near the surface closer to the trunk.","options":["was","were","are"]},{"type":"plain","text":"That made the root explanation seem reasonable."},{"type":"choice","prefix":"However, the class ","correct":"could","tail":" not see what was directly beneath the sidewalk.","options":["was","could","has"]},{"type":"choice","prefix":"Mr. Chen warned ","correct":"them","tail":" not to treat a possible cause as a proven one.","options":["him","her","them"]},{"type":"choice","prefix":"Students photographed the ","correct":"crack","tail":" from the safe side of the cones.","options":["shadow","stain","crack"]},{"type":"choice","prefix":"","correct":"They","tail":" measured its length using a tape held along undamaged pavement.","options":["They","It","She"]},{"type":"plain","text":"The raised section was greatest near one end of the crack."},{"type":"plain","text":"They also noticed a low area where rainwater often collected."},{"type":"choice","prefix":"Those ","correct":"observations","tail":" gave the class additional clues.","options":["predictions","observations","decorations"]},{"type":"plain","text":"Next, they researched how water and temperature can affect pavement."},{"type":"plain","text":"The investigation moved from observation to background research."}],[{"type":"choice","prefix":"Water ","correct":"can","tail":" enter small openings in pavement and soil.","options":["is","can","has"]},{"type":"choice","prefix":"When liquid water freezes, ","correct":"it","tail":" expands.","options":["they","he","it"]},{"type":"choice","prefix":"Repeated freezing and thawing ","correct":"can","tail":" move soil and place stress on pavement.","options":["can","is","has"]},{"type":"choice","prefix":"","correct":"This","tail":" process can contribute to cracks in cold climates.","options":["These","This","Those"]},{"type":"plain","text":"Tree roots can also grow beneath sidewalks and lift sections over time."},{"type":"choice","prefix":"The class realized that both ","correct":"explanations","tail":" were scientifically possible.","options":["questions","predictions","explanations"]},{"type":"plain","text":"They checked local weather records from the previous winter."},{"type":"choice","prefix":"Temperatures had crossed above and below ","correct":"freezing","tail":" many times.","options":["freezing","evaporation","pollination"]},{"type":"plain","text":"That evidence showed conditions for freeze-thaw cycles had occurred."},{"type":"plain","text":"It did not prove those cycles caused this particular crack."},{"type":"plain","text":"The nearby tree remained another possible factor."},{"type":"plain","text":"The students needed information they could not safely collect themselves."}],[{"type":"plain","text":"The school's facilities manager visited the class after inspecting the site."},{"type":"choice","prefix":"","correct":"She","tail":" explained that workers had carefully lifted the damaged slab.","options":["They","It","She"]},{"type":"choice","prefix":"A thick tree root ","correct":"was","tail":" pressing against one edge from below.","options":["was","were","are"]},{"type":"choice","prefix":"The soil also showed signs of repeated moisture and ","correct":"freezing","tail":".","options":["evaporation","freezing","pollination"]},{"type":"choice","prefix":"Workers believed both factors ","correct":"had","tail":" contributed to the damage.","options":["has","had","have"]},{"type":"choice","prefix":"The ","correct":"root","tail":" had slowly raised part of the slab.","options":["pipe","stone","root"]},{"type":"plain","text":"Water entering the stressed area likely made the cracking worse during winter."},{"type":"choice","prefix":"Students compared ","correct":"this","tail":" explanation with their earlier notes.","options":["these","those","this"]},{"type":"plain","text":"Their two main ideas had both been partly supported."},{"type":"plain","text":"Mr. Chen pointed out that real problems often have multiple causes."},{"type":"plain","text":"The facilities manager described how the repair plan would protect the tree when possible."},{"type":"plain","text":"A new sidewalk section would be shaped to provide safer space around the root."}],[{"type":"choice","prefix":"After repairs ","correct":"were","tail":" completed, the class revisited the area.","options":["were","was","is"]},{"type":"choice","prefix":"The new pavement ","correct":"was","tail":" level and the safety cones were gone.","options":["were","was","are"]},{"type":"plain","text":"A wider space around the tree reduced pressure on the sidewalk."},{"type":"choice","prefix":"Students created a poster explaining what ","correct":"they","tail":" had learned.","options":["it","she","they"]},{"type":"choice","prefix":"","correct":"They","tail":" included photographs, weather data, and the facilities manager's findings.","options":["They","It","She"]},{"type":"choice","prefix":"Their conclusion did not claim that every sidewalk ","correct":"crack","tail":" has the same cause.","options":["shadow","stain","crack"]},{"type":"plain","text":"Instead, it explained the evidence from this particular location."},{"type":"choice","prefix":"The project showed why ","correct":"observations","tail":" alone may not reveal everything hidden underground.","options":["observations","predictions","decorations"]},{"type":"plain","text":"Research helped them identify possible processes."},{"type":"plain","text":"An expert inspection provided evidence they could not safely obtain."},{"type":"plain","text":"The cracked sidewalk had seemed like a simple problem at first."},{"type":"plain","text":"By the end, students understood that several interacting factors can shape what they observe."}]]},{"num":6,"title":"Messages Across the Mountain","pages":[[{"type":"plain","text":"Before phones and radios, people still needed ways to send information across long distances."},{"type":"choice","prefix":"In a history unit, Ms. Allen's class studied ","correct":"communication","tail":" in mountainous regions.","options":["communication","transportation","irrigation"]},{"type":"choice","prefix":"Steep slopes and deep valleys ","correct":"could","tail":" make travel slow.","options":["could","was","has"]},{"type":"choice","prefix":"A message carried by a person ","correct":"might","tail":" take hours or days to reach another settlement.","options":["was","might","has"]},{"type":"plain","text":"Communities developed different methods depending on place, technology, and purpose."},{"type":"choice","prefix":"Some used signal fires or flags where people could see across a ","correct":"distance","tail":".","options":["temperature","weight","distance"]},{"type":"plain","text":"Others depended on riders, runners, or later telegraph lines."},{"type":"plain","text":"Ms. Allen warned students not to assume one method was used everywhere."},{"type":"plain","text":"Historical communication systems varied greatly across time and cultures."},{"type":"plain","text":"The class would compare several documented examples."},{"type":"choice","prefix":"","correct":"Their","tail":" task was to identify both advantages and limitations.","options":["His","Our","Their"]},{"type":"choice","prefix":"","correct":"They","tail":" began with visual signals.","options":["They","It","She"]}],[{"type":"choice","prefix":"A visual signal ","correct":"can","tail":" travel quickly when observers have a clear line of sight.","options":["is","can","has"]},{"type":"choice","prefix":"Flags, lights, or smoke ","correct":"can","tail":" represent agreed-upon messages.","options":["is","has","can"]},{"type":"plain","text":"However, mountains can block the view between two locations."},{"type":"choice","prefix":"Fog, darkness, or storms can also make ","correct":"signals","tail":" difficult to see.","options":["supplies","signals","buildings"]},{"type":"choice","prefix":"Some systems solved ","correct":"this","tail":" problem by using a chain of signal stations.","options":["this","these","those"]},{"type":"choice","prefix":"One station received a message and passed ","correct":"it","tail":" to the next.","options":["they","it","he"]},{"type":"plain","text":"The method could move information faster than a traveler on foot."},{"type":"choice","prefix":"Still, each ","correct":"station","tail":" needed trained people and a shared code.","options":["station","different","ordinary"]},{"type":"plain","text":"A mistake at one point could affect the message farther along."},{"type":"plain","text":"Students compared the system to passing information through a relay."},{"type":"plain","text":"Speed was an advantage, but reliability required careful organization."},{"type":"plain","text":"Geography shaped where the stations could be placed."}],[{"type":"plain","text":"The class next studied the telegraph, which sent coded electrical signals through wires."},{"type":"choice","prefix":"Telegraph messages ","correct":"could","tail":" travel far faster than physical letters.","options":["was","has","could"]},{"type":"choice","prefix":"Mountain communities gained quicker access to news when lines reached ","correct":"them","tail":".","options":["them","him","her"]},{"type":"choice","prefix":"Building ","correct":"those","tail":" lines, however, required difficult work.","options":["this","those","these"]},{"type":"choice","prefix":"Poles and wires ","correct":"had","tail":" to cross rough terrain and survive severe weather.","options":["has","have","had"]},{"type":"choice","prefix":"A ","correct":"damaged","tail":" line could interrupt communication until workers repaired it.","options":["improved","protected","damaged"]},{"type":"plain","text":"Students examined a photograph of workers installing poles on a steep slope."},{"type":"choice","prefix":"The image showed equipment being moved along a narrow ","correct":"route","tail":".","options":["route","weather","building"]},{"type":"plain","text":"Ms. Allen asked what the photograph could prove and what it could not."},{"type":"plain","text":"It showed that construction occurred in challenging terrain."},{"type":"plain","text":"It did not reveal how every worker felt or how long the entire project took."},{"type":"plain","text":"The class practiced separating evidence from assumptions."}],[{"type":"plain","text":"Students then compared telegraph messages with letters carried by mail."},{"type":"choice","prefix":"A telegraph ","correct":"was","tail":" faster, but messages were often brief and could cost money to send.","options":["was","were","are"]},{"type":"choice","prefix":"Letters ","correct":"could","tail":" contain more detail and travel without an electrical line.","options":["was","could","has"]},{"type":"choice","prefix":"However, mail still depended on ","correct":"transportation","tail":" and weather.","options":["different","transportation","ordinary"]},{"type":"plain","text":"Neither method was best for every situation."},{"type":"choice","prefix":"A short urgent ","correct":"message","tail":" might favor speed.","options":["different","ordinary","message"]},{"type":"plain","text":"A long personal account might be better suited to a letter."},{"type":"plain","text":"The class created a chart comparing speed, detail, equipment, and reliability."},{"type":"choice","prefix":"","correct":"They","tail":" noticed that new technology did not instantly replace older methods.","options":["It","She","They"]},{"type":"plain","text":"Different systems often existed at the same time."},{"type":"choice","prefix":"People chose among ","correct":"them","tail":" based on need and availability.","options":["them","him","her"]},{"type":"plain","text":"Communication history was more complex than a simple march from old to new."}],[{"type":"choice","prefix":"For ","correct":"their","tail":" final project, groups designed a communication plan for an imaginary mountain settlement.","options":["his","their","our"]},{"type":"choice","prefix":"","correct":"They","tail":" had to use technologies available during a specific historical period.","options":["It","She","They"]},{"type":"plain","text":"One group placed signal stations on visible ridges and used runners in hidden valleys."},{"type":"choice","prefix":"Another used a ","correct":"telegraph","tail":" line for urgent messages and mail for longer ones.","options":["telescope","telegraph","thermometer"]},{"type":"plain","text":"Students explained why geography affected each choice."},{"type":"choice","prefix":"Ms. Allen checked that their plans matched the evidence they ","correct":"had","tail":" studied.","options":["had","has","have"]},{"type":"choice","prefix":"The goal ","correct":"was","tail":" not to invent the most exciting system.","options":["were","was","are"]},{"type":"plain","text":"It was to build a reasonable plan within historical limits."},{"type":"plain","text":"Students revised several ideas after noticing impossible routes on their maps."},{"type":"choice","prefix":"Their final plans ","correct":"combined","tail":" technology, geography, and purpose.","options":["separate","combined","hidden"]},{"type":"plain","text":"The project helped them understand why communication systems develop differently."},{"type":"plain","text":"A mountain was not just scenery; it could shape how information moved."}]]},{"num":7,"title":"When the River Changed Course","pages":[[{"type":"plain","text":"For decades, Willow River curved around the eastern edge of a farming valley."},{"type":"plain","text":"After an unusually wet spring, residents noticed changes along one bend."},{"type":"choice","prefix":"Fast water ","correct":"had","tail":" cut into the outside bank.","options":["has","had","have"]},{"type":"choice","prefix":"Sand and gravel ","correct":"were","tail":" collecting on the inside of the curve.","options":["was","is","were"]},{"type":"plain","text":"A fourth-grade class visited the area with a park educator after the water level became safe."},{"type":"choice","prefix":"","correct":"They","tail":" remained on a marked trail well away from the unstable bank.","options":["They","It","She"]},{"type":"choice","prefix":"The educator, Mr. Singh, showed ","correct":"them","tail":" an aerial photograph taken five years earlier.","options":["him","them","her"]},{"type":"choice","prefix":"The older image showed the river bend in a slightly ","correct":"different","tail":" position.","options":["different","ordinary","similar"]},{"type":"plain","text":"Students wondered whether a river could actually move across the land."},{"type":"plain","text":"Mr. Singh explained that river channels can change gradually over time."},{"type":"choice","prefix":"Erosion removes material in some places while deposition adds ","correct":"it","tail":" in others.","options":["they","he","it"]},{"type":"plain","text":"The class began looking for evidence of both processes."}],[{"type":"choice","prefix":"On the outside of the bend, the bank ","correct":"was","tail":" steep and freshly exposed.","options":["were","are","was"]},{"type":"choice","prefix":"Several plant roots hung from the soil where material ","correct":"had","tail":" washed away.","options":["had","has","have"]},{"type":"plain","text":"The current moved fastest near that outer edge."},{"type":"choice","prefix":"Mr. Singh identified ","correct":"this","tail":" as an area of erosion.","options":["these","this","those"]},{"type":"plain","text":"Across the channel, the inside bend looked very different."},{"type":"choice","prefix":"A low bar of sand and gravel rose above the ","correct":"shallow","tail":" water.","options":["different","ordinary","shallow"]},{"type":"plain","text":"The slower current there could no longer carry as much sediment."},{"type":"plain","text":"Some of the transported material had been deposited."},{"type":"plain","text":"Students sketched both sides of the bend."},{"type":"choice","prefix":"","correct":"Their","tail":" drawings showed removal on one side and buildup on the other.","options":["His","Our","Their"]},{"type":"plain","text":"The two processes were happening within the same river curve."},{"type":"choice","prefix":"That helped ","correct":"explain","tail":" how the channel could slowly shift.","options":["different","ordinary","explain"]}],[{"type":"plain","text":"Back in class, students compared aerial images from several years."},{"type":"choice","prefix":"","correct":"They","tail":" traced the river's edge on transparent sheets.","options":["They","It","She"]},{"type":"choice","prefix":"When the outlines ","correct":"were","tail":" stacked, small changes became easier to see.","options":["was","were","is"]},{"type":"choice","prefix":"The outside bank ","correct":"had","tail":" moved gradually toward one field.","options":["has","have","had"]},{"type":"plain","text":"The inside sandbar had also grown."},{"type":"choice","prefix":"No single photograph showed the entire ","correct":"process","tail":".","options":["object","location","process"]},{"type":"plain","text":"Together, the images revealed a pattern over time."},{"type":"choice","prefix":"Students calculated ","correct":"approximate","tail":" distances using the map scale.","options":["approximate","different","ordinary"]},{"type":"choice","prefix":"","correct":"They","tail":" were careful to describe the measurements as estimates.","options":["They","It","She"]},{"type":"plain","text":"Image resolution and tracing could introduce small errors."},{"type":"plain","text":"Even with those limits, the direction of change was clear."},{"type":"plain","text":"The river bend had not remained fixed."}],[{"type":"choice","prefix":"The class then researched how floods ","correct":"can","tail":" speed up channel changes.","options":["is","can","has"]},{"type":"choice","prefix":"Higher water ","correct":"can","tail":" move with greater force and carry more sediment.","options":["is","has","can"]},{"type":"choice","prefix":"A flood ","correct":"may","tail":" erode banks that were stable during ordinary flow.","options":["may","is","has"]},{"type":"choice","prefix":"","correct":"It","tail":" can also deposit large amounts of material when water slows.","options":["They","It","He"]},{"type":"plain","text":"However, one wet season does not affect every river in the same way."},{"type":"choice","prefix":"Rock type, ","correct":"vegetation","tail":", channel shape, and human structures can influence the result.","options":["different","ordinary","vegetation"]},{"type":"plain","text":"Students avoided claiming that the spring rains were the only cause of the bend's movement."},{"type":"plain","text":"The aerial images showed that change had already been occurring for years."},{"type":"plain","text":"The wet spring may have accelerated an existing process."},{"type":"choice","prefix":"Mr. Singh praised that cautious ","correct":"conclusion","tail":".","options":["different","conclusion","ordinary"]},{"type":"plain","text":"Scientific explanations often improve when evidence from different times is combined."},{"type":"plain","text":"The class revised its notes to include both gradual and faster change."}],[{"type":"plain","text":"Several months later, the park installed a new observation sign farther from the bank."},{"type":"choice","prefix":"The sign explained ","correct":"erosion","tail":", deposition, and river movement.","options":["erosion","condensation","pollination"]},{"type":"choice","prefix":"","correct":"It","tail":" also reminded visitors to stay away from unstable edges.","options":["They","He","It"]},{"type":"choice","prefix":"Students ","correct":"returned","tail":" to see the finished display.","options":["different","returned","ordinary"]},{"type":"choice","prefix":"","correct":"Their","tail":" class sketches had helped inspire one of the diagrams.","options":["Their","His","Our"]},{"type":"plain","text":"The river still followed the same general valley, but its bend continued to change."},{"type":"choice","prefix":"Students understood that maps ","correct":"can","tail":" make natural features look permanently fixed.","options":["is","can","has"]},{"type":"plain","text":"In reality, some landscapes change on human time scales."},{"type":"choice","prefix":"The river ","correct":"was","tail":" both a place and an ongoing process.","options":["were","are","was"]},{"type":"plain","text":"Erosion and deposition continually reshaped its channel."},{"type":"plain","text":"The class left with a different view of the familiar valley."},{"type":"plain","text":"What seemed still from a distance was slowly moving."}]]},{"num":8,"title":"The Library's Energy Challenge","pages":[[{"type":"choice","prefix":"The Oak Street Library wanted to reduce the amount of electricity ","correct":"it","tail":" used.","options":["they","he","it"]},{"type":"choice","prefix":"The building ","correct":"was","tail":" open long hours and contained lights, computers, and heating equipment.","options":["was","were","are"]},{"type":"choice","prefix":"Library staff asked a local energy educator to help study ","correct":"their","tail":" use.","options":["his","their","our"]},{"type":"choice","prefix":"A ","correct":"fourth-grade","tail":" class joined the project as part of a science unit.","options":["different","fourth-grade","ordinary"]},{"type":"choice","prefix":"Their teacher made clear that students ","correct":"would","tail":" not handle electrical equipment.","options":["was","has","would"]},{"type":"choice","prefix":"Instead, they would examine safe ","correct":"observations","tail":" and energy-use data.","options":["predictions","decorations","observations"]},{"type":"plain","text":"The educator, Ms. Brooks, showed a graph of monthly electricity use."},{"type":"plain","text":"Summer and winter months were generally higher than spring and fall."},{"type":"plain","text":"Students suggested several possible reasons for the pattern."},{"type":"plain","text":"Heating, cooling, lighting, and building hours could all matter."},{"type":"plain","text":"The graph showed when electricity use changed, but not exactly why."},{"type":"plain","text":"The class needed more information."}],[{"type":"plain","text":"Students began with a lighting survey."},{"type":"choice","prefix":"","correct":"They","tail":" counted fixtures in public areas and recorded how long different spaces were occupied.","options":["They","It","She"]},{"type":"choice","prefix":"Some lights remained on even when small meeting rooms ","correct":"were","tail":" empty.","options":["was","were","is"]},{"type":"choice","prefix":"Large reading areas, however, needed steady ","correct":"lighting","tail":" for safety and comfort.","options":["different","lighting","ordinary"]},{"type":"choice","prefix":"The class ","correct":"did","tail":" not recommend simply turning off every possible light.","options":["does","do","did"]},{"type":"choice","prefix":"Instead, ","correct":"they","tail":" looked for places where use could be reduced without creating problems.","options":["they","it","she"]},{"type":"plain","text":"Ms. Brooks explained that efficiency means providing a service with less wasted energy."},{"type":"plain","text":"Replacing older bulbs with efficient ones was another option."},{"type":"plain","text":"The library had already upgraded many fixtures but not all of them."},{"type":"choice","prefix":"Students ","correct":"estimated","tail":" how many older bulbs remained.","options":["different","estimated","ordinary"]},{"type":"plain","text":"Their count gave staff a useful starting point."},{"type":"plain","text":"The survey connected everyday observations with energy decisions."}],[{"type":"plain","text":"Next, the class examined computer use."},{"type":"choice","prefix":"Public computers ","correct":"automatically","tail":" entered a low-power mode after a period of inactivity.","options":["automatically","carelessly","rarely"]},{"type":"choice","prefix":"Staff computers ","correct":"had","tail":" similar settings.","options":["has","had","have"]},{"type":"choice","prefix":"Students learned that small savings ","correct":"can","tail":" add up when many devices operate every day.","options":["is","has","can"]},{"type":"choice","prefix":"","correct":"They","tail":" also noticed printers and displays that were used only occasionally.","options":["They","It","She"]},{"type":"choice","prefix":"Ms. Brooks cautioned ","correct":"them","tail":" against assuming every device should simply be unplugged.","options":["him","them","her"]},{"type":"plain","text":"Some equipment needed to remain available or follow manufacturer instructions."},{"type":"choice","prefix":"The goal was to identify ","correct":"realistic","tail":" changes, not dramatic ones.","options":["realistic","imaginary","impossible"]},{"type":"plain","text":"Students interviewed staff about how different devices were used."},{"type":"plain","text":"That information helped separate essential use from possible waste."},{"type":"plain","text":"They added several low-risk suggestions to their report."},{"type":"plain","text":"Each suggestion included evidence and a reason."}],[{"type":"choice","prefix":"Heating and cooling ","correct":"were","tail":" more difficult to analyze.","options":["was","is","were"]},{"type":"choice","prefix":"The ","correct":"library's","tail":" system served many rooms with different needs.","options":["library's","different","ordinary"]},{"type":"choice","prefix":"Outdoor temperature, sunlight, insulation, and the number of visitors ","correct":"could","tail":" affect energy use.","options":["could","was","has"]},{"type":"choice","prefix":"Students compared ","correct":"electricity","tail":" data with local weather records.","options":["rainfall","electricity","traffic"]},{"type":"plain","text":"Very hot weeks often matched periods of higher electricity use."},{"type":"plain","text":"That pattern suggested cooling was one important factor."},{"type":"plain","text":"Still, the class could not calculate exactly how much electricity the cooling system used from the available data."},{"type":"choice","prefix":"","correct":"They","tail":" labeled their conclusion appropriately.","options":["It","They","She"]},{"type":"choice","prefix":"Ms. Brooks showed ","correct":"them","tail":" how professionals use detailed meters for stronger measurements.","options":["him","her","them"]},{"type":"plain","text":"The class saw the difference between a reasonable inference and a precise result."},{"type":"plain","text":"Their evidence supported some conclusions more strongly than others."},{"type":"plain","text":"Careful wording made the report more trustworthy."}],[{"type":"choice","prefix":"At the end of the project, students presented ","correct":"their","tail":" findings to library staff.","options":["their","his","our"]},{"type":"choice","prefix":"","correct":"They","tail":" recommended finishing the efficient-lighting upgrade and reviewing automatic power settings.","options":["It","They","She"]},{"type":"plain","text":"They also suggested reminder signs for meeting-room lights."},{"type":"choice","prefix":"The staff chose several ideas to test over the next few ","correct":"months","tail":".","options":["different","months","ordinary"]},{"type":"plain","text":"No one promised a specific amount of savings before collecting new data."},{"type":"choice","prefix":"Ms. Brooks encouraged the class to compare future ","correct":"electricity","tail":" use with similar months from earlier years.","options":["rainfall","traffic","electricity"]},{"type":"choice","prefix":"Weather and building hours ","correct":"would","tail":" need to be considered.","options":["was","has","would"]},{"type":"plain","text":"The project showed that conservation involves both technology and human choices."},{"type":"choice","prefix":"Students ","correct":"had","tail":" not solved every energy question in the building.","options":["had","has","have"]},{"type":"plain","text":"They had identified practical steps supported by evidence."},{"type":"plain","text":"The library gained useful information, and the class gained experience analyzing real data."},{"type":"plain","text":"Small observations had become part of a larger conservation effort."}]]},{"num":9,"title":"A Letter From the Dust Bowl","pages":[[{"type":"plain","text":"During a history lesson, Mrs. Warren displayed a scanned letter written in 1936."},{"type":"choice","prefix":"The writer ","correct":"was","tail":" a teenager named Ruth whose family lived on a farm in the Great Plains.","options":["was","were","are"]},{"type":"plain","text":"Ruth described dust blowing across fields and collecting near the house."},{"type":"choice","prefix":"","correct":"She","tail":" wrote that some days the sky became unusually dark.","options":["They","She","It"]},{"type":"choice","prefix":"The class knew ","correct":"they","tail":" were reading a primary source from the Dust Bowl era.","options":["it","she","they"]},{"type":"choice","prefix":"Mrs. Warren explained that a ","correct":"primary","tail":" source comes from the time being studied.","options":["modern","fictional","primary"]},{"type":"choice","prefix":"The letter ","correct":"could","tail":" reveal what one person experienced.","options":["could","was","has"]},{"type":"choice","prefix":"It could not ","correct":"represent","tail":" every family in the Great Plains.","options":["represent","different","ordinary"]},{"type":"plain","text":"Students read the document slowly and marked details they could support directly."},{"type":"plain","text":"They noticed references to dry weather, blowing soil, and difficult farm conditions."},{"type":"plain","text":"Ruth also mentioned hoping for rain."},{"type":"plain","text":"Her words gave the class a personal view of a larger historical event."}],[{"type":"plain","text":"The class compared Ruth's letter with a textbook account of the Dust Bowl."},{"type":"choice","prefix":"The textbook described years of severe ","correct":"drought","tail":" in parts of the Great Plains.","options":["drought","flood","frost"]},{"type":"choice","prefix":"","correct":"It","tail":" also explained that farming practices had left some soil vulnerable to wind erosion.","options":["They","It","He"]},{"type":"choice","prefix":"When crops failed, less plant cover ","correct":"remained","tail":" to hold soil in place.","options":["different","remained","ordinary"]},{"type":"choice","prefix":"Strong winds ","correct":"could","tail":" then carry exposed topsoil away.","options":["was","has","could"]},{"type":"plain","text":"Ruth's description of blowing dust matched that broader explanation."},{"type":"choice","prefix":"However, the textbook included information Ruth ","correct":"may","tail":" not have known.","options":["may","is","has"]},{"type":"choice","prefix":"","correct":"It","tail":" discussed conditions across several states and over many years.","options":["They","It","He"]},{"type":"plain","text":"Students recognized that the two sources served different purposes."},{"type":"plain","text":"The letter described one family's experience."},{"type":"plain","text":"The textbook summarized research from many sources."},{"type":"plain","text":"Using both helped students connect personal experience with historical context."}],[{"type":"plain","text":"Mrs. Warren then showed a photograph of a massive dust cloud approaching a town."},{"type":"choice","prefix":"Students reacted to the ","correct":"dramatic","tail":" image.","options":["dramatic","ordinary","silent"]},{"type":"choice","prefix":"","correct":"She","tail":" asked them to examine it carefully before making conclusions.","options":["They","It","She"]},{"type":"choice","prefix":"The photograph showed a ","correct":"particular","tail":" storm at a particular place and time.","options":["general","particular","random"]},{"type":"choice","prefix":"","correct":"It","tail":" did not prove that every day looked the same.","options":["It","They","He"]},{"type":"plain","text":"Students compared buildings in the image with descriptions in Ruth's letter."},{"type":"choice","prefix":"Both sources showed how dust ","correct":"could","tail":" affect communities, but in different ways.","options":["was","could","has"]},{"type":"plain","text":"The photograph provided visual evidence."},{"type":"choice","prefix":"The letter described sounds, worries, and daily experiences that a photograph ","correct":"could","tail":" not capture.","options":["was","has","could"]},{"type":"plain","text":"Neither source answered every question."},{"type":"plain","text":"Together, they provided different kinds of evidence."},{"type":"plain","text":"The class added both to a source-comparison chart."}],[{"type":"plain","text":"Students researched how the Dust Bowl affected migration."},{"type":"choice","prefix":"Many families left parts of the Great Plains in search of work and better ","correct":"conditions","tail":".","options":["conditions","different","ordinary"]},{"type":"plain","text":"California became one destination, though migrants traveled to other places as well."},{"type":"choice","prefix":"Not every family moved, and reasons for leaving ","correct":"varied","tail":".","options":["identical","varied","fixed"]},{"type":"choice","prefix":"Economic hardship, drought, crop failure, and debt ","correct":"could","tail":" overlap.","options":["could","was","has"]},{"type":"choice","prefix":"Ruth's letter did not say that ","correct":"her","tail":" family planned to leave.","options":["them","her","him"]},{"type":"choice","prefix":"Mrs. Warren warned students not to add that story simply because migration ","correct":"was","tail":" common.","options":["were","are","was"]},{"type":"plain","text":"Historical context can explain possibilities without proving an individual's actions."},{"type":"plain","text":"The class searched later records connected with Ruth's county."},{"type":"choice","prefix":"","correct":"They","tail":" found evidence that her family remained there through the following year.","options":["They","It","She"]},{"type":"plain","text":"That detail made her individual story more specific."},{"type":"plain","text":"It also reminded students that broad historical patterns contain many different experiences."}],[{"type":"plain","text":"For the final discussion, students returned to Ruth's original letter."},{"type":"choice","prefix":"The document seemed more meaningful after ","correct":"they","tail":" had studied the wider context.","options":["it","they","she"]},{"type":"choice","prefix":"","correct":"They","tail":" could identify which details matched regional patterns and which belonged specifically to Ruth.","options":["It","She","They"]},{"type":"choice","prefix":"Mrs. Warren asked why historians use ","correct":"multiple","tail":" sources.","options":["single","multiple","unrelated"]},{"type":"choice","prefix":"One source ","correct":"may","tail":" contain valuable evidence while still having limits.","options":["may","is","has"]},{"type":"choice","prefix":"Comparing sources ","correct":"can","tail":" reveal agreements, differences, and missing information.","options":["is","can","has"]},{"type":"plain","text":"Students wrote short explanations using the letter, photograph, and t

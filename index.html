extbook."},{"type":"choice","prefix":"","correct":"They","tail":" cited details instead of making unsupported claims.","options":["It","She","They"]},{"type":"plain","text":"Ruth's letter remained only one person's account."},{"type":"plain","text":"Yet it helped the class understand how a major environmental crisis affected daily life."},{"type":"plain","text":"The lesson did not turn Ruth into a symbol for everyone."},{"type":"plain","text":"Instead, it showed how individual voices can deepen the study of history."}]]},{"num":10,"title":"The Wetland Behind the School","pages":[[{"type":"plain","text":"Behind Cedar School, a shallow wetland filled with water during much of the year."},{"type":"choice","prefix":"","correct":"Cattails","tail":" and grasses grew around its muddy edges.","options":["Cattails","different","ordinary"]},{"type":"choice","prefix":"Frogs, insects, and birds ","correct":"were","tail":" often visible from a raised boardwalk.","options":["was","were","is"]},{"type":"choice","prefix":"When a construction project ","correct":"was","tail":" proposed nearby, students became curious about the wetland.","options":["were","are","was"]},{"type":"choice","prefix":"","correct":"Their","tail":" teacher, Ms. Vega, explained that wetlands can perform several ecological functions.","options":["Their","His","Our"]},{"type":"choice","prefix":"","correct":"They","tail":" can provide habitat, store water, and trap some sediment.","options":["It","They","She"]},{"type":"plain","text":"However, different wetlands vary in size, condition, and importance."},{"type":"choice","prefix":"The class would study their local site without assuming every ","correct":"wetland","tail":" worked exactly the same way.","options":["wetland","desert","canyon"]},{"type":"plain","text":"Students began by mapping what they could observe from the boardwalk."},{"type":"plain","text":"They marked open water, dense plants, and the direction of a small incoming stream."},{"type":"plain","text":"They also recorded animal sightings."},{"type":"plain","text":"The map created a baseline for later observations."}],[{"type":"plain","text":"After a heavy rain, the class returned with a local environmental educator."},{"type":"choice","prefix":"The wetland held much more water than ","correct":"it","tail":" had the week before.","options":["they","he","it"]},{"type":"choice","prefix":"Some nearby ground ","correct":"was","tail":" soggy, but the boardwalk remained above the water.","options":["was","were","are"]},{"type":"choice","prefix":"The educator, Mr. Alvarez, explained that wetlands ","correct":"can","tail":" temporarily store runoff.","options":["is","can","has"]},{"type":"choice","prefix":"Holding water can slow how quickly ","correct":"it","tail":" moves downstream.","options":["they","he","it"]},{"type":"choice","prefix":"That does not mean a ","correct":"wetland","tail":" prevents every flood.","options":["desert","canyon","wetland"]},{"type":"plain","text":"The amount of rain, soil conditions, and surrounding land all affect flooding."},{"type":"choice","prefix":"Students ","correct":"measured","tail":" water depth only at safe marked locations with adult supervision.","options":["measured","painted","covered"]},{"type":"plain","text":"They compared those measurements with earlier records."},{"type":"plain","text":"Several areas were noticeably deeper after the storm."},{"type":"plain","text":"Over the next week, water levels gradually dropped."},{"type":"plain","text":"The observations showed the wetland changing as water entered and left."}],[{"type":"plain","text":"Students also investigated sediment."},{"type":"choice","prefix":"The incoming stream looked cloudy after rain because ","correct":"it","tail":" carried tiny particles.","options":["it","they","he"]},{"type":"plain","text":"Near the center of the wetland, the water appeared less cloudy."},{"type":"choice","prefix":"Mr. Alvarez explained that slower-moving water ","correct":"can","tail":" allow some sediment to settle.","options":["is","can","has"]},{"type":"choice","prefix":"Plants can also slow water near ","correct":"their","tail":" stems.","options":["his","our","their"]},{"type":"choice","prefix":"The class collected no water samples because that required ","correct":"procedures","tail":" beyond their project.","options":["different","ordinary","procedures"]},{"type":"plain","text":"Instead, they used photographs and observations from designated points."},{"type":"choice","prefix":"Their ","correct":"evidence","tail":" suggested that conditions changed as water moved through the wetland.","options":["evidence","opinion","decoration"]},{"type":"choice","prefix":"They avoided claiming that all sediment ","correct":"was","tail":" removed.","options":["was","were","are"]},{"type":"plain","text":"Some particles continued downstream."},{"type":"plain","text":"The process depended on water speed, particle size, and other factors."},{"type":"plain","text":"The class added these limits to its notes."}],[{"type":"plain","text":"Animal observations gave students another reason to study the site."},{"type":"choice","prefix":"","correct":"They","tail":" recorded red-winged blackbirds, dragonflies, frogs, and several ducks.","options":["It","They","She"]},{"type":"plain","text":"Different animals used different parts of the wetland."},{"type":"choice","prefix":"Birds ","correct":"perched","tail":" on tall plants while frogs stayed near shallow water.","options":["different","perched","ordinary"]},{"type":"plain","text":"Students researched how wetlands provide food, shelter, and breeding areas for many species."},{"type":"choice","prefix":"","correct":"They","tail":" were careful not to claim that every observed animal depended entirely on this one wetland.","options":["It","She","They"]},{"type":"plain","text":"Some species also used nearby fields, trees, or streams."},{"type":"choice","prefix":"","correct":"Habitat","tail":" connections extended beyond the boardwalk map.","options":["Habitat","weather","machine"]},{"type":"plain","text":"The proposed construction therefore raised questions about the surrounding area as well."},{"type":"choice","prefix":"Environmental planners ","correct":"would","tail":" need more detailed studies than the class could perform.","options":["would","was","has"]},{"type":"choice","prefix":"Students understood that their observations ","correct":"were","tail":" useful but limited.","options":["was","were","is"]},{"type":"plain","text":"Scientific decisions often require information collected at several scales."}],[{"type":"plain","text":"At the end of the unit, the class presented a wetland report to the principal."},{"type":"choice","prefix":"","correct":"They","tail":" described water storage, sediment settling, and habitat observations.","options":["It","She","They"]},{"type":"plain","text":"Each section separated direct evidence from information learned through research."},{"type":"choice","prefix":"","correct":"They","tail":" also listed questions their study could not answer.","options":["They","It","She"]},{"type":"choice","prefix":"The construction proposal ","correct":"was","tail":" still being reviewed by professionals.","options":["were","was","are"]},{"type":"choice","prefix":"Ms. Vega reminded students that their classroom project ","correct":"did","tail":" not determine the decision.","options":["does","do","did"]},{"type":"plain","text":"Its purpose was to understand the wetland and practice evidence-based reasoning."},{"type":"plain","text":"Students had learned that ecosystems can provide several functions at once."},{"type":"choice","prefix":"","correct":"They","tail":" had also learned to avoid claims stronger than their data.","options":["They","It","She"]},{"type":"choice","prefix":"The ","correct":"wetland","tail":" behind the school no longer looked like an unused patch of water.","options":["desert","wetland","canyon"]},{"type":"plain","text":"It was a changing system connected to weather, land, and living things."},{"type":"plain","text":"Their careful study had made that complexity visible."}]]}],"5":[{"title":"The Town That Saved Its Water","pages":[[{"type":"choice","prefix":"By late August, the small town of Cedar Grove had gone many weeks ","correct":"without","tail":" much rain.","options":["without","during","before"]},{"type":"choice","prefix":"The river beside town was ","correct":"lower","tail":" than usual, and patches of dry ground showed along its banks.","options":["lower","higher","wider"]},{"type":"plain","text":"Lawns that were normally green had begun to turn brown."},{"type":"choice","prefix":"At school, Maya noticed a sign asking everyone to ","correct":"conserve","tail":" water.","options":["conserve","pollute","measure"]},{"type":"plain","text":"She understood that conserve meant to use a resource carefully and avoid wasting it."},{"type":"choice","prefix":"Still, she wondered whether one person's choices could make much ","correct":"difference","tail":".","options":["difference","weather","noise"]},{"type":"plain","text":"Her science teacher, Mr. Ortiz, asked the class the same question."},{"type":"choice","prefix":"Instead of answering it, he challenged the students to ","correct":"investigate","tail":".","options":["investigate","celebrate","ignore"]},{"type":"plain","text":"Each group would study how water was used in one part of the school."},{"type":"plain","text":"Maya's group chose the sinks near the cafeteria."},{"type":"plain","text":"They planned to observe the area without interrupting anyone."},{"type":"choice","prefix":"Their goal was to find small changes that might ","correct":"reduce","tail":" wasted water.","options":["reduce","increase","hide"]}],[{"type":"plain","text":"During lunch, the group watched students wash their hands at the sinks."},{"type":"choice","prefix":"Most students turned off the water as soon as they were ","correct":"finished","tail":".","options":["finished","arrived","started"]},{"type":"choice","prefix":"","correct":"However","tail":", one faucet continued to drip after it was closed.","options":["However","Therefore","Meanwhile"]},{"type":"choice","prefix":"Maya placed an empty measuring cup ","correct":"beneath","tail":" the slow drip.","options":["beneath","above","beside"]},{"type":"plain","text":"After ten minutes, the cup held a small amount of water."},{"type":"plain","text":"That amount did not seem important at first."},{"type":"choice","prefix":"Then Maya considered how often the faucet might drip during an ","correct":"entire","tail":" day.","options":["entire","brief","single"]},{"type":"plain","text":"Her group repeated the measurement twice to check their result."},{"type":"plain","text":"The amounts were nearly the same each time."},{"type":"choice","prefix":"That pattern made their evidence more ","correct":"reliable","tail":".","options":["reliable","random","unclear"]},{"type":"plain","text":"The students reported the leaking faucet to the school office."},{"type":"choice","prefix":"A custodian later repaired ","correct":"it","tail":" so the steady drip would stop.","options":["it","they","she"]}],[{"type":"plain","text":"Another group studied the water used in the school garden."},{"type":"choice","prefix":"They discovered that watering at midday was not always ","correct":"efficient","tail":".","options":["efficient","careless","harmful"]},{"type":"choice","prefix":"On hot, sunny days, some water could ","correct":"evaporate","tail":" before plants used it.","options":["evaporate","freeze","collect"]},{"type":"choice","prefix":"The students learned that watering ","correct":"earlier","tail":" in the day could reduce that loss.","options":["earlier","later","never"]},{"type":"plain","text":"They also examined the soil beneath a layer of mulch."},{"type":"choice","prefix":"The covered soil felt cooler and stayed ","correct":"moist","tail":" longer than bare soil nearby.","options":["moist","dusty","frozen"]},{"type":"plain","text":"Mulch helped slow the loss of water from the ground."},{"type":"plain","text":"The group did not claim that one method would work in every garden."},{"type":"choice","prefix":"Weather, soil, and the kinds of plants ","correct":"could","tail":" affect the results.","options":["could","was","does"]},{"type":"plain","text":"Instead, they recommended several changes for the school's garden."},{"type":"plain","text":"The class liked that their suggestions were based on observations."},{"type":"choice","prefix":"They were learning that useful solutions often depend on ","correct":"evidence","tail":".","options":["evidence","guessing","luck"]}],[{"type":"choice","prefix":"Maya's class ","correct":"combined","tail":" the findings from all the groups.","options":["combined","forgot","separated"]},{"type":"choice","prefix":"Some changes were simple, such as reporting leaks ","correct":"quickly","tail":".","options":["quickly","rarely","silently"]},{"type":"plain","text":"Other ideas required people to change daily habits."},{"type":"plain","text":"The students created posters explaining why saving water mattered."},{"type":"choice","prefix":"They avoided messages that ","correct":"blamed","tail":" people for using water.","options":["blamed","thanked","followed"]},{"type":"choice","prefix":"Instead, the posters suggested ","correct":"practical","tail":" ways to waste less.","options":["practical","impossible","careless"]},{"type":"plain","text":"One poster reminded students to turn faucets off completely."},{"type":"plain","text":"Another explained why the garden could be watered earlier in the morning."},{"type":"plain","text":"The class also shared its findings with the principal."},{"type":"choice","prefix":"","correct":"She","tail":" agreed to have staff check faucets more often for leaks.","options":["She","He","They"]},{"type":"plain","text":"Mr. Ortiz reminded the students that conservation is a shared effort."},{"type":"choice","prefix":"Many small actions can have a larger effect when people work ","correct":"together","tail":".","options":["together","alone","apart"]}],[{"type":"choice","prefix":"A few weeks later, Cedar Grove finally received a long, ","correct":"steady","tail":" rain.","options":["steady","brief","silent"]},{"type":"plain","text":"Puddles formed on sidewalks, and water flowed through the gutters."},{"type":"plain","text":"Maya was glad to hear rain tapping against her bedroom window."},{"type":"choice","prefix":"Even so, she knew the town's water concerns had not simply ","correct":"disappeared","tail":".","options":["disappeared","increased","returned"]},{"type":"choice","prefix":"One storm could help, but it could not ","correct":"erase","tail":" weeks of dry weather.","options":["erase","measure","predict"]},{"type":"plain","text":"The class continued using the habits it had practiced."},{"type":"plain","text":"Maya no longer wondered whether small actions mattered."},{"type":"choice","prefix":"She had seen how careful ","correct":"observations","tail":" could lead to practical changes.","options":["observations","arguments","rumors"]},{"type":"plain","text":"She had also learned that evidence could improve an idea."},{"type":"choice","prefix":"A solution did not need to be ","correct":"dramatic","tail":" to be useful.","options":["dramatic","expensive","perfect"]},{"type":"choice","prefix":"Sometimes progress came from noticing a small problem and responding ","correct":"wisely","tail":".","options":["wisely","carelessly","randomly"]},{"type":"plain","text":"For Maya, the dripping faucet had become a reminder that small choices could add up."}]],"num":1},{"num":2,"title":"The Signal Beneath the Sea","pages":[[{"type":"choice","prefix":"In the 1800s, sending a message across the Atlantic Ocean ","correct":"could","tail":" take weeks.","options":["could","can","would"]},{"type":"choice","prefix":"Letters ","correct":"traveled","tail":" aboard ships that faced storms, fog, and changing winds.","options":["ordinary","traveled","unrelated"]},{"type":"choice","prefix":"On land, the telegraph ","correct":"had","tail":" already made communication much faster.","options":["has","have","had"]},{"type":"plain","text":"Electrical signals could carry coded messages along wires much faster than ships could carry letters."},{"type":"choice","prefix":"Inventors ","correct":"wondered","tail":" whether a similar system could connect continents.","options":["wondered","ordinary","unrelated"]},{"type":"plain","text":"The idea sounded simple, but the ocean created enormous challenges."},{"type":"plain","text":"A cable would need to stretch for thousands of miles across the seafloor."},{"type":"choice","prefix":"","correct":"It","tail":" also had to carry a clear electrical signal over that distance.","options":["They","It","He"]},{"type":"choice","prefix":"Engineers could not easily inspect a cable once ","correct":"it","tail":" disappeared beneath deep water.","options":["they","he","it"]},{"type":"plain","text":"They knew that one damaged section might interrupt the entire connection."},{"type":"plain","text":"Even so, several groups believed the project was possible."},{"type":"plain","text":"Their efforts began a long experiment in engineering and communication."}],[{"type":"plain","text":"Designers created cables with a conducting wire protected by layers of insulation and armor."},{"type":"choice","prefix":"The materials ","correct":"had","tail":" to resist seawater while remaining flexible enough to be laid from a ship.","options":["had","has","have"]},{"type":"plain","text":"Manufacturing such a long cable required careful planning."},{"type":"choice","prefix":"Workers tested sections before loading ","correct":"them","tail":" aboard specially prepared vessels.","options":["him","them","her"]},{"type":"choice","prefix":"During early ","correct":"attempts","tail":", the cable sometimes snapped and sank beyond reach.","options":["ordinary","unrelated","attempts"]},{"type":"plain","text":"Other times, electrical signals became too weak to understand."},{"type":"choice","prefix":"Each failure ","correct":"was","tail":" expensive and disappointing.","options":["was","were","is"]},{"type":"choice","prefix":"However, engineers used the results to identify weaknesses in ","correct":"their","tail":" designs.","options":["his","their","our"]},{"type":"plain","text":"They adjusted equipment, improved materials, and changed how the cable was released."},{"type":"plain","text":"Progress came through repeated testing rather than one perfect attempt."},{"type":"choice","prefix":"The ","correct":"project","tail":" demanded patience as well as technical skill.","options":["argument","prediction","project"]},{"type":"plain","text":"Eventually, the teams were ready to try again."}],[{"type":"plain","text":"In 1858, a cable finally connected Ireland and Newfoundland for a short time."},{"type":"choice","prefix":"Messages crossed the Atlantic far faster than a ship could carry ","correct":"them","tail":".","options":["them","him","her"]},{"type":"plain","text":"The achievement attracted enormous public attention."},{"type":"choice","prefix":"Yet the success ","correct":"did","tail":" not last.","options":["does","did","do"]},{"type":"choice","prefix":"The cable ","correct":"stopped","tail":" working after only a few weeks.","options":["ordinary","unrelated","stopped"]},{"type":"choice","prefix":"Investigators debated why ","correct":"it","tail":" had failed, and several technical problems were considered.","options":["it","they","he"]},{"type":"plain","text":"Instead of abandoning the goal, engineers continued studying the evidence."},{"type":"choice","prefix":"They ","correct":"developed","tail":" stronger cable and improved methods for transmitting signals.","options":["ordinary","developed","unrelated"]},{"type":"plain","text":"A later expedition used the Great Eastern, a massive steamship capable of carrying an enormous length of cable."},{"type":"choice","prefix":"In 1866, a durable transatlantic connection ","correct":"was","tail":" completed.","options":["were","is","was"]},{"type":"plain","text":"Communication between Europe and North America changed dramatically."},{"type":"plain","text":"News that once required weeks of travel could now cross the ocean rapidly."}],[{"type":"choice","prefix":"The cable ","correct":"did","tail":" not make communication instant by modern standards.","options":["did","does","do"]},{"type":"choice","prefix":"Telegraph operators still ","correct":"had","tail":" to encode, send, receive, and deliver messages.","options":["has","had","have"]},{"type":"plain","text":"Sending a long message could also be costly."},{"type":"choice","prefix":"Even with ","correct":"those","tail":" limits, the new connection had significant effects.","options":["this","these","those"]},{"type":"choice","prefix":"Governments could ","correct":"exchange","tail":" information more quickly during international events.","options":["exchange","ordinary","unrelated"]},{"type":"plain","text":"Businesses could receive market news without waiting for a ship."},{"type":"plain","text":"Newspapers gained faster access to reports from overseas."},{"type":"choice","prefix":"Families could send urgent ","correct":"messages","tail":" across the Atlantic in far less time.","options":["ordinary","messages","unrelated"]},{"type":"plain","text":"The technology reduced one major barrier created by distance."},{"type":"choice","prefix":"","correct":"It","tail":" also increased expectations about how quickly information should travel.","options":["They","He","It"]},{"type":"plain","text":"As additional cables were installed, international communication became more reliable."},{"type":"plain","text":"A difficult engineering project helped reshape everyday ideas about time and distance."}],[{"type":"plain","text":"Modern communication no longer depends on the original telegraph cables."},{"type":"choice","prefix":"Fiber-optic cables now carry ","correct":"enormous","tail":" amounts of digital information beneath the oceans.","options":["enormous","moderate","limited"]},{"type":"choice","prefix":"","correct":"Their","tail":" technology is far more advanced, but the basic challenge of crossing vast underwater distances remains.","options":["His","Their","Our"]},{"type":"choice","prefix":"Engineers still plan routes, protect cables, and repair damage when ","correct":"it","tail":" occurs.","options":["they","he","it"]},{"type":"choice","prefix":"The nineteenth-century projects showed what ","correct":"could","tail":" happen when repeated failures were treated as evidence.","options":["could","can","would"]},{"type":"choice","prefix":"Designers ","correct":"did","tail":" not succeed because the ocean became easier to cross.","options":["does","did","do"]},{"type":"plain","text":"They succeeded because their methods improved."},{"type":"choice","prefix":"The story also shows why major ","correct":"inventions","tail":" are rarely the work of one moment or one person.","options":["ordinary","unrelated","inventions"]},{"type":"plain","text":"Many workers, engineers, investors, and operators contributed to the system."},{"type":"plain","text":"Their combined efforts created a communication network that earlier generations could hardly imagine."},{"type":"plain","text":"Today's messages travel differently, but they still depend on physical systems connecting distant places."},{"type":"plain","text":"The cable beneath the sea became one step in that much larger story."}]]},{"num":3,"title":"The Forest After the Fire","pages":[[{"type":"plain","text":"A wildfire moved through part of Pine Ridge National Forest during a dry summer."},{"type":"choice","prefix":"Firefighters ","correct":"protected","tail":" nearby communities while the flames burned across several thousand acres.","options":["protected","ordinary","unrelated"]},{"type":"choice","prefix":"After the fire ","correct":"was","tail":" contained, photographs showed blackened tree trunks and patches of bare ground.","options":["were","was","is"]},{"type":"plain","text":"To many visitors, the area appeared completely destroyed."},{"type":"choice","prefix":"Forest ecologist Dr. Elena Ruiz explained that the situation ","correct":"was","tail":" more complicated.","options":["were","is","was"]},{"type":"plain","text":"Wildfire can cause severe damage, but fire is also a natural process in many ecosystems."},{"type":"plain","text":"Its effects depend on intensity, weather, vegetation, and location."},{"type":"choice","prefix":"Some areas of the forest had burned much more ","correct":"intensely","tail":" than others.","options":["intensely","ordinary","unrelated"]},{"type":"plain","text":"Researchers planned to monitor the landscape for several years."},{"type":"choice","prefix":"","correct":"They","tail":" wanted to understand which species returned and how quickly conditions changed.","options":["It","They","She"]},{"type":"plain","text":"The first surveys began only weeks after the fire."},{"type":"choice","prefix":"","correct":"Those","tail":" early observations provided a starting point for comparison.","options":["This","These","Those"]}],[{"type":"plain","text":"In lightly burned areas, many mature trees remained alive."},{"type":"choice","prefix":"Some plants had lost leaves, yet ","correct":"their","tail":" roots survived below the soil.","options":["their","his","our"]},{"type":"plain","text":"New shoots appeared within months."},{"type":"choice","prefix":"Other species were adapted in ways that helped ","correct":"them","tail":" respond to fire.","options":["him","them","her"]},{"type":"choice","prefix":"Certain pine cones ","correct":"can","tail":" remain closed until heat helps release their seeds.","options":["could","will","can"]},{"type":"choice","prefix":"Open ground ","correct":"may","tail":" then provide sunlight and space for young plants.","options":["may","might","can"]},{"type":"plain","text":"These adaptations do not mean fire is harmless."},{"type":"choice","prefix":"Animals can lose ","correct":"shelter","tail":", soil can erode, and intense fires can kill large areas of vegetation.","options":["ordinary","shelter","unrelated"]},{"type":"plain","text":"Instead, adaptations show that some organisms have developed ways to survive recurring disturbance."},{"type":"plain","text":"Dr. Ruiz asked students visiting the site to avoid describing the forest as either ruined or improved."},{"type":"choice","prefix":"Both ","correct":"descriptions","tail":" were too simple.","options":["ordinary","unrelated","descriptions"]},{"type":"plain","text":"The evidence showed a mixture of loss, survival, and change."}],[{"type":"plain","text":"Heavy rain created another concern after the fire."},{"type":"choice","prefix":"Without dense vegetation, exposed soil ","correct":"was","tail":" more vulnerable to erosion.","options":["was","were","is"]},{"type":"choice","prefix":"Water moving downhill ","correct":"could","tail":" carry sediment into nearby streams.","options":["can","could","would"]},{"type":"plain","text":"Crews placed barriers in several steep locations to slow runoff."},{"type":"choice","prefix":"Researchers measured water clarity and ","correct":"sediment","tail":" after storms.","options":["moisture","nutrients","sediment"]},{"type":"choice","prefix":"","correct":"They","tail":" compared those results with measurements from less affected streams.","options":["They","It","She"]},{"type":"choice","prefix":"The data helped ","correct":"them","tail":" identify places where erosion was most severe.","options":["him","them","her"]},{"type":"choice","prefix":"However, one storm could not reveal the entire ","correct":"recovery","tail":" pattern.","options":["ordinary","unrelated","recovery"]},{"type":"plain","text":"Conditions changed with rainfall, plant growth, and additional erosion."},{"type":"plain","text":"Scientists therefore continued collecting information over many seasons."},{"type":"plain","text":"Long-term monitoring allowed them to distinguish temporary effects from lasting ones."},{"type":"plain","text":"Recovery was a process rather than a single event."}],[{"type":"plain","text":"Two years later, the burned landscape looked noticeably different."},{"type":"choice","prefix":"Grasses and ","correct":"wildflowers","tail":" covered many open areas.","options":["wildflowers","ordinary","unrelated"]},{"type":"choice","prefix":"Young shrubs ","correct":"had","tail":" become established near surviving trees.","options":["has","had","have"]},{"type":"plain","text":"Some heavily burned sections still contained large stretches of dead wood."},{"type":"choice","prefix":"That wood ","correct":"provided","tail":" habitat for insects and nesting birds.","options":["ordinary","unrelated","provided"]},{"type":"choice","prefix":"","correct":"It","tail":" also returned nutrients to the soil as it decomposed.","options":["It","They","He"]},{"type":"plain","text":"Researchers documented which species became more common and which remained scarce."},{"type":"choice","prefix":"","correct":"They","tail":" did not expect the forest to return to its exact previous condition.","options":["It","They","She"]},{"type":"plain","text":"Ecosystems continue changing even without a major fire."},{"type":"choice","prefix":"Climate, competition, disease, and future disturbances ","correct":"can","tail":" influence what grows.","options":["could","will","can"]},{"type":"plain","text":"The scientists focused on describing the developing community accurately."},{"type":"plain","text":"Their work showed that recovery can follow several paths."}],[{"type":"plain","text":"Visitors now encounter signs explaining the research along a designated trail."},{"type":"choice","prefix":"The signs ","correct":"include","tail":" photographs taken from the same locations over several years.","options":["include","ordinary","unrelated"]},{"type":"plain","text":"Comparing the images makes gradual changes easier to recognize."},{"type":"choice","prefix":"Dr. Ruiz hopes visitors understand that a burned forest ","correct":"is","tail":" not simply an empty landscape.","options":["are","is","was"]},{"type":"choice","prefix":"","correct":"It","tail":" contains organisms responding to altered conditions.","options":["They","He","It"]},{"type":"choice","prefix":"Some changes happen quickly, while others ","correct":"may","tail":" take decades.","options":["may","might","can"]},{"type":"plain","text":"Severe fires can create serious environmental problems and threaten people and wildlife."},{"type":"choice","prefix":"At the same time, fire has long ","correct":"influenced","tail":" many natural ecosystems.","options":["ordinary","influenced","unrelated"]},{"type":"plain","text":"Understanding both facts requires careful attention to context."},{"type":"plain","text":"The Pine Ridge study does not predict exactly what will happen after every wildfire."},{"type":"choice","prefix":"","correct":"It","tail":" does show why scientists collect evidence over time.","options":["They","He","It"]},{"type":"plain","text":"A landscape that looked motionless after the flames was already beginning to change."}]]},{"num":4,"title":"The Debate Over the Old Theater","pages":[[{"type":"choice","prefix":"The Grand Theater ","correct":"had","tail":" stood in downtown Bellview for nearly ninety years.","options":["had","has","have"]},{"type":"choice","prefix":"Its brick walls, painted ceiling, and tall entrance made ","correct":"it","tail":" a familiar landmark.","options":["they","it","he"]},{"type":"choice","prefix":"However, the building ","correct":"had","tail":" been closed for several years because major repairs were needed.","options":["has","have","had"]},{"type":"choice","prefix":"A developer proposed replacing ","correct":"it","tail":" with apartments and stores.","options":["it","they","he"]},{"type":"choice","prefix":"Another group wanted the city to ","correct":"preserve","tail":" and restore the theater.","options":["ordinary","preserve","unrelated"]},{"type":"plain","text":"Residents quickly discovered that the decision involved more than liking or disliking an old building."},{"type":"plain","text":"The theater had historical value, but renovation would be expensive."},{"type":"choice","prefix":"New ","correct":"construction","tail":" could provide housing and business space.","options":["ordinary","unrelated","construction"]},{"type":"plain","text":"Preservation supporters argued that the theater contributed to the city's identity."},{"type":"plain","text":"Others questioned whether public money should support the project."},{"type":"plain","text":"The city council scheduled several meetings to gather information."},{"type":"plain","text":"Before voting, council members wanted evidence about cost, safety, history, and community needs."}],[{"type":"plain","text":"Engineers inspected the building and found several structural problems."},{"type":"choice","prefix":"Parts of the roof needed replacement, and electrical systems ","correct":"were","tail":" outdated.","options":["were","was","are"]},{"type":"choice","prefix":"The inspection ","correct":"did","tail":" not conclude that restoration was impossible.","options":["does","did","do"]},{"type":"choice","prefix":"Instead, ","correct":"it","tail":" estimated what repairs would be necessary for safe use.","options":["they","he","it"]},{"type":"choice","prefix":"A ","correct":"preservation","tail":" organization hired an expert to study the theater's historical significance.","options":["preservation","ordinary","unrelated"]},{"type":"choice","prefix":"","correct":"She","tail":" documented its architecture and its role in local events.","options":["They","She","It"]},{"type":"plain","text":"The developer presented a separate report describing the proposed apartments and shops."},{"type":"choice","prefix":"That plan ","correct":"included","tail":" estimates for construction, parking, and tax revenue.","options":["ordinary","unrelated","included"]},{"type":"plain","text":"Each report emphasized different information."},{"type":"plain","text":"Council members had to compare the evidence rather than rely on one source."},{"type":"plain","text":"They also asked questions about assumptions behind the cost estimates."},{"type":"plain","text":"A large decision required examining both benefits and limitations."}],[{"type":"plain","text":"Public comments revealed another layer of disagreement."},{"type":"choice","prefix":"Some ","correct":"longtime","tail":" residents remembered attending movies and performances at the theater.","options":["longtime","ordinary","unrelated"]},{"type":"choice","prefix":"","correct":"They","tail":" believed restoration would protect an important part of Bellview's history.","options":["It","They","She"]},{"type":"plain","text":"Younger residents spoke about the shortage of affordable housing near downtown."},{"type":"choice","prefix":"Business owners ","correct":"had","tail":" mixed views about which project might attract more visitors.","options":["has","have","had"]},{"type":"choice","prefix":"Several speakers proposed a compromise that would preserve the theater's entrance while allowing new construction behind ","correct":"it","tail":".","options":["it","they","he"]},{"type":"choice","prefix":"Architects said the idea ","correct":"was","tail":" possible, although it would require a redesigned plan.","options":["were","was","is"]},{"type":"choice","prefix":"The ","correct":"developer","tail":" agreed to study the suggestion.","options":["ordinary","unrelated","developer"]},{"type":"plain","text":"Preservation advocates asked whether enough of the original building would remain."},{"type":"plain","text":"No proposal satisfied every group completely."},{"type":"plain","text":"The debate shifted from choosing between two simple options to considering several alternatives."},{"type":"plain","text":"The compromise idea required both sides to reconsider what they valued most."}],[{"type":"choice","prefix":"After months of ","correct":"discussion","tail":", the council reviewed revised proposals.","options":["discussion","ordinary","unrelated"]},{"type":"choice","prefix":"One plan ","correct":"restored","tail":" the entire theater using a combination of private donations and public funds.","options":["ordinary","restored","unrelated"]},{"type":"plain","text":"Another preserved the historic front section and added housing on the rear of the property."},{"type":"plain","text":"A third allowed complete replacement but required the developer to document the building before demolition."},{"type":"choice","prefix":"Council ","correct":"members","tail":" compared projected costs and community benefits.","options":["ordinary","unrelated","members"]},{"type":"choice","prefix":"","correct":"They","tail":" also considered information from the safety inspection.","options":["They","It","She"]},{"type":"plain","text":"The meeting lasted several hours."},{"type":"plain","text":"In the end, the council approved the plan that preserved the front portion while adding housing."},{"type":"plain","text":"The decision pleased some residents and disappointed others."},{"type":"choice","prefix":"Council members explained the reasons for ","correct":"their","tail":" votes in the public record.","options":["his","their","our"]},{"type":"choice","prefix":"Their explanations showed which evidence they ","correct":"had","tail":" considered most important.","options":["has","have","had"]},{"type":"plain","text":"The outcome represented a compromise rather than a perfect solution."}],[{"type":"plain","text":"Construction began the following year."},{"type":"choice","prefix":"Workers carefully supported the historic entrance while removing unsafe sections behind ","correct":"it","tail":".","options":["it","they","he"]},{"type":"plain","text":"New apartments gradually rose around the preserved structure."},{"type":"plain","text":"The restored entrance became part of a public lobby containing photographs and artifacts from the theater."},{"type":"choice","prefix":"Some residents still wished the entire building ","correct":"had","tail":" been saved.","options":["has","had","have"]},{"type":"choice","prefix":"Others continued to believe more housing should ","correct":"have","tail":" been built.","options":["has","had","have"]},{"type":"choice","prefix":"The disagreement ","correct":"did","tail":" not disappear when the council voted.","options":["did","does","do"]},{"type":"choice","prefix":"However, the ","correct":"process","tail":" had required public comments, expert reports, revised plans, and recorded decisions.","options":["location","process","result"]},{"type":"plain","text":"Students studying the project learned that civic choices often involve competing priorities."},{"type":"plain","text":"Evidence can clarify consequences without making every value judgment disappear."},{"type":"choice","prefix":"People may ","correct":"examine","tail":" the same facts and still emphasize different goals.","options":["ordinary","unrelated","examine"]},{"type":"plain","text":"The Grand Theater debate became a local example of how communities negotiate change."}]]},{"num":5,"title":"Tracking a Storm From Space","pages":[[{"type":"plain","text":"Meteorologists monitor weather using information from many sources."},{"type":"choice","prefix":"Ground ","correct":"stations","tail":" measure conditions such as temperature, wind, and air pressure.","options":["stations","ordinary","unrelated"]},{"type":"choice","prefix":"Radar ","correct":"can","tail":" reveal where precipitation is falling and how storms are moving.","options":["could","can","will"]},{"type":"choice","prefix":"Satellites provide another important perspective because ","correct":"they","tail":" observe large areas from above.","options":["it","she","they"]},{"type":"choice","prefix":"During ","correct":"hurricane","tail":" season, satellite images help scientists follow storms over the ocean.","options":["hurricane","ordinary","unrelated"]},{"type":"plain","text":"A fifth-grade class studied a series of images from one Atlantic hurricane."},{"type":"choice","prefix":"","correct":"Their","tail":" teacher, Ms. Patel, reminded them that a satellite image is a measurement tool, not simply a photograph.","options":["His","Their","Our"]},{"type":"plain","text":"Different satellite instruments detect different kinds of energy coming from Earth and its atmosphere."},{"type":"plain","text":"Scientists combine those measurements to learn about clouds, moisture, and temperature."},{"type":"plain","text":"No single image provides every detail about a storm."},{"type":"choice","prefix":"The class ","correct":"would","tail":" compare several types of evidence.","options":["could","will","would"]},{"type":"plain","text":"Their goal was to understand how forecasts are developed and revised."}],[{"type":"plain","text":"Visible-light images showed the storm's clouds during daylight."},{"type":"choice","prefix":"Infrared instruments provided information related to cloud-top temperatures and ","correct":"could","tail":" be used at night.","options":["could","can","would"]},{"type":"plain","text":"The class noticed a circular pattern forming around the storm's center."},{"type":"plain","text":"Over time, the cloud structure became more organized."},{"type":"choice","prefix":"Meteorologists also ","correct":"measured","tail":" wind speed using aircraft and other instruments.","options":["ordinary","measured","unrelated"]},{"type":"choice","prefix":"","correct":"Those","tail":" measurements helped determine the storm's intensity.","options":["This","These","Those"]},{"type":"plain","text":"Students learned that a hurricane category describes wind speed, not the total danger from a storm."},{"type":"choice","prefix":"Heavy rain, flooding, waves, and storm surge ","correct":"can","tail":" also cause severe damage.","options":["can","could","will"]},{"type":"plain","text":"A lower-category storm can still create dangerous conditions."},{"type":"plain","text":"Ms. Patel emphasized that one number should never replace the full forecast."},{"type":"choice","prefix":"Understanding risk ","correct":"requires","tail":" several kinds of information.","options":["ordinary","requires","unrelated"]},{"type":"choice","prefix":"The students added that idea to ","correct":"their","tail":" weather notebooks.","options":["his","our","their"]}],[{"type":"choice","prefix":"Forecasting the storm's path ","correct":"was","tail":" another challenge.","options":["was","were","is"]},{"type":"choice","prefix":"Computer models used ","correct":"observations","tail":" and mathematical equations to estimate future conditions.","options":["predictions","observations","assumptions"]},{"type":"plain","text":"Different models sometimes produced slightly different tracks."},{"type":"choice","prefix":"Meteorologists compared ","correct":"those","tail":" results rather than choosing one model automatically.","options":["this","these","those"]},{"type":"choice","prefix":"As new observations arrived, forecasts ","correct":"were","tail":" updated.","options":["were","was","are"]},{"type":"plain","text":"The predicted path shifted somewhat over several days."},{"type":"plain","text":"Students initially thought the earlier forecasts must have been wrong."},{"type":"choice","prefix":"Ms. Patel ","correct":"explained","tail":" that forecasts describe the best estimate based on information available at the time.","options":["ordinary","explained","unrelated"]},{"type":"plain","text":"New data can improve or alter that estimate."},{"type":"plain","text":"Changing a forecast is not necessarily evidence of failure."},{"type":"choice","prefix":"","correct":"It","tail":" can show that scientists are responding to new information.","options":["They","He","It"]},{"type":"plain","text":"The class began to view forecasting as an ongoing process."}],[{"type":"plain","text":"The storm eventually turned toward the coast."},{"type":"choice","prefix":"Emergency ","correct":"officials","tail":" used forecasts to make decisions about warnings and evacuations.","options":["officials","ordinary","unrelated"]},{"type":"choice","prefix":"","correct":"Those","tail":" decisions had to be made before every detail was certain.","options":["This","Those","These"]},{"type":"choice","prefix":"Waiting for complete certainty ","correct":"could","tail":" leave communities without enough preparation time.","options":["can","would","could"]},{"type":"choice","prefix":"Acting too early ","correct":"could","tail":" also create costs and disruption.","options":["could","can","would"]},{"type":"plain","text":"Officials therefore considered both the forecast and the possible consequences of delay."},{"type":"plain","text":"Students discussed why uncertainty does not mean that evidence is useless."},{"type":"choice","prefix":"A forecast can still provide valuable ","correct":"guidance","tail":" even when the exact track is unknown.","options":["certainty","guidance","warning"]},{"type":"choice","prefix":"","correct":"They","tail":" examined a cone-shaped forecast graphic showing a range of possible center locations.","options":["It","She","They"]},{"type":"plain","text":"Ms. Patel warned them that dangerous effects can occur outside that cone."},{"type":"plain","text":"Reading the entire explanation was more informative than looking only at the picture."},{"type":"plain","text":"Weather communication was part of the forecasting challenge."}],[{"type":"plain","text":"After the hurricane passed, scientists compared forecasts with what actually occurred."},{"type":"choice","prefix":"","correct":"They","tail":" examined the storm's track, intensity, rainfall, and coastal effects.","options":["They","It","She"]},{"type":"choice","prefix":"","correct":"This","tail":" evaluation helped researchers test and improve forecasting methods.","options":["These","This","Those"]},{"type":"plain","text":"The class reviewed the satellite sequence one final time."},{"type":"choice","prefix":"Images that ","correct":"had","tail":" first looked like swirling clouds now contained much more information.","options":["has","have","had"]},{"type":"choice","prefix":"Students ","correct":"could","tail":" identify changes in organization and connect them with other measurements.","options":["could","can","would"]},{"type":"plain","text":"They also understood why forecasts had changed as new evidence arrived."},{"type":"choice","prefix":"Modern ","correct":"weather","tail":" prediction depends on satellites, radar, aircraft, ground instruments, and computer models working together.","options":["ordinary","weather","unrelated"]},{"type":"plain","text":"Even advanced technology cannot remove every uncertainty."},{"type":"plain","text":"Its value comes from improving the information available for decisions."},{"type":"choice","prefix":"The storm-from-space project taught students to treat a forecast as evidence-based ","correct":"guidance","tail":" rather than a promise.","options":["certainty","warning","guidance"]},{"type":"plain","text":"That distinction made them more careful readers of weather information."}]]},{"num":6,"title":"The Expedition That Changed a Map","pages":[[{"type":"plain","text":"At the beginning of the nineteenth century, many maps of western North America contained large areas unfamiliar to U.S. mapmakers."},{"type":"choice","prefix":"Rivers, mountains, and Indigenous communities already existed throughout the region, but federal officials had limited geographic information about ","correct":"them","tail":".","options":["them","him","her"]},{"type":"plain","text":"In 1804, the Lewis and Clark expedition began traveling west from the Mississippi River region."},{"type":"choice","prefix":"President Thomas Jefferson ","correct":"had","tail":" directed the group to gather information about land, waterways, plants, animals, and peoples.","options":["has","had","have"]},{"type":"choice","prefix":"Meriwether Lewis and William Clark kept ","correct":"detailed","tail":" journals during the journey.","options":["ordinary","unrelated","detailed"]},{"type":"plain","text":"Other members contributed observations and practical knowledge."},{"type":"choice","prefix":"The expedition ","correct":"did","tail":" not enter an empty or unknown world.","options":["did","does","do"]},{"type":"choice","prefix":"Indigenous nations had lived in and traveled across ","correct":"these","tail":" lands for generations.","options":["this","these","those"]},{"type":"plain","text":"Their knowledge, trade networks, and assistance became important to the expedition."},{"type":"plain","text":"Modern historians examine the journey from more than one perspective so that the expedition is not told only through the captains' experiences."},{"type":"choice","prefix":"Maps and journals provide valuable ","correct":"evidence","tail":", but they also reflect the goals of the people who created them.","options":["assumption","opinion","evidence"]},{"type":"plain","text":"The class studying the expedition began with that distinction."}],[{"type":"plain","text":"As the group traveled up the Missouri River, Clark regularly recorded geographic information."},{"type":"choice","prefix":"","correct":"He","tail":" estimated distances, noted river bends, and sketched features of the landscape.","options":["He","They","It"]},{"type":"choice","prefix":"","correct":"These","tail":" observations contributed to maps created during and after the expedition.","options":["This","These","Those"]},{"type":"choice","prefix":"Accuracy ","correct":"was","tail":" difficult to achieve with the available instruments and conditions.","options":["were","is","was"]},{"type":"choice","prefix":"Weather, ","correct":"currents","tail":", and rough terrain affected measurements.","options":["currents","ordinary","unrelated"]},{"type":"plain","text":"Even so, the maps contained information that later travelers and officials considered useful."},{"type":"plain","text":"Students compared one expedition map with a modern map."},{"type":"choice","prefix":"Some general features ","correct":"were","tail":" recognizable, while other positions were inaccurate.","options":["was","were","are"]},{"type":"plain","text":"Their teacher explained that historical maps should be evaluated in context."},{"type":"plain","text":"A map can be valuable even when later technology reveals errors."},{"type":"choice","prefix":"The students looked for both useful information and ","correct":"limitations","tail":".","options":["advantages","requirements","limitations"]},{"type":"plain","text":"They avoided treating the old map as either perfect or worthless."}],[{"type":"plain","text":"The expedition depended heavily on interactions with Indigenous nations."},{"type":"choice","prefix":"Communities provided food, directions, ","correct":"geographic","tail":" knowledge, horses, and other forms of assistance at different points.","options":["geographic","political","historical"]},{"type":"plain","text":"Sacagawea, a Lemhi Shoshone woman traveling with the group, helped in several important ways."},{"type":"choice","prefix":"","correct":"Her","tail":" presence sometimes signaled that the expedition was not a war party.","options":["Them","Her","Him"]},{"type":"choice","prefix":"","correct":"She","tail":" also interpreted in some situations and helped the group obtain horses through Shoshone contacts.","options":["They","It","She"]},{"type":"choice","prefix":"However, simplified stories sometimes exaggerate or misstate ","correct":"her","tail":" role.","options":["her","them","him"]},{"type":"plain","text":"Historians compare journals and other evidence to describe her contributions carefully."},{"type":"choice","prefix":"Students ","correct":"noticed","tail":" that older textbooks often centered Lewis and Clark while giving less attention to Indigenous knowledge.","options":["ordinary","noticed","unrelated"]},{"type":"plain","text":"Newer scholarship examines a wider range of participants and consequences."},{"type":"plain","text":"The expedition's survival and movement cannot be understood only through the actions of its two captains."},{"type":"plain","text":"Perspective changes which details receive attention."},{"type":"choice","prefix":"Studying multiple sources ","correct":"can","tail":" produce a fuller account.","options":["could","will","can"]}],[{"type":"plain","text":"After crossing the Rocky Mountains, the expedition eventually reached the Pacific coast."},{"type":"choice","prefix":"The return journey provided additional opportunities to correct and expand ","correct":"geographic","tail":" records.","options":["geographic","political","historical"]},{"type":"plain","text":"When the group returned in 1806, its maps and journals circulated among officials and mapmakers."},{"type":"plain","text":"The information increased U.S. knowledge of routes and landscapes in the West."},{"type":"choice","prefix":"","correct":"It","tail":" also supported expanding U.S. interest in lands already inhabited by many Indigenous nations.","options":["They","It","He"]},{"type":"plain","text":"That expansion later brought major political, economic, and cultural consequences."},{"type":"choice","prefix":"Students discussed why a map ","correct":"can","tail":" be both a scientific record and a tool connected to power.","options":["could","will","can"]},{"type":"choice","prefix":"Mapping a place ","correct":"may","tail":" influence how governments imagine, claim, or manage territory.","options":["may","might","can"]},{"type":"plain","text":"The expedition's documents therefore have more than geographic importance."},{"type":"choice","prefix":"","correct":"They","tail":" reveal observations, assumptions, goals, and relationships from a particular historical moment.","options":["It","They","She"]},{"type":"choice","prefix":"Understanding those layers ","correct":"requires","tail":" reading beyond a single heroic narrative.","options":["ordinary","unrelated","requires"]},{"type":"plain","text":"History becomes more accurate when evidence is placed in context."}],[{"type":"choice","prefix":"For ","correct":"their","tail":" final project, students compared three sources about one part of the expedition.","options":["their","his","our"]},{"type":"choice","prefix":"","correct":"They","tail":" used an excerpt from a journal, a historical map, and a modern historian's explanation.","options":["It","They","She"]},{"type":"choice","prefix":"Each source ","correct":"contributed","tail":" something different.","options":["ordinary","unrelated","contributed"]},{"type":"plain","text":"The journal provided observations from a participant."},{"type":"choice","prefix":"The map showed how geographic information ","correct":"was","tail":" recorded visually.","options":["was","were","is"]},{"type":"plain","text":"The modern account connected those records with additional evidence and perspectives."},{"type":"plain","text":"Students identified agreements as well as gaps between the sources."},{"type":"choice","prefix":"They also noted whose voices ","correct":"were","tail":" missing from particular documents.","options":["was","were","are"]},{"type":"plain","text":"Their conclusions became more precise as they compared evidence."},{"type":"plain","text":"The expedition had indeed changed maps available to U.S. officials."},{"type":"choice","prefix":"Yet the class ","correct":"understood","tail":" that the lands themselves were already known, named, and used by the people who lived there.","options":["ordinary","unrelated","understood"]},{"type":"plain","text":"That distinction made their historical explanation stronger rather than simpler."}]]},{"num":7,"title":"Why Some Cities Are Getting Hotter","pages":[[{"type":"choice","prefix":"On a summer afternoon, temperatures ","correct":"can","tail":" differ noticeably within the same city.","options":["can","could","will"]},{"type":"choice","prefix":"A tree-lined park ","correct":"may","tail":" feel cooler than a nearby parking lot.","options":["might","may","can"]},{"type":"choice","prefix":"Scientists describe one reason for ","correct":"this","tail":" pattern as the urban heat island effect.","options":["these","those","this"]},{"type":"plain","text":"Buildings, pavement, and other constructed surfaces can absorb and store solar energy."},{"type":"choice","prefix":"Areas with fewer trees may also ","correct":"receive","tail":" less shade and cooling from evaporation through plants.","options":["receive","ordinary","unrelated"]},{"type":"plain","text":"As a result, some developed neighborhoods remain warmer than surrounding areas, especially after sunset."},{"type":"plain","text":"A fifth-grade class investigated temperature patterns around its community."},{"type":"choice","prefix":"Students used ","correct":"digital","tail":" thermometers under adult supervision at several predetermined locations.","options":["ordinary","digital","unrelated"]},{"type":"choice","prefix":"","correct":"They","tail":" measured at the same time of day to make comparisons more useful.","options":["It","She","They"]},{"type":"plain","text":"One measurement would not be enough to describe an entire neighborhood."},{"type":"plain","text":"The class repeated its observations on several clear days."},{"type":"plain","text":"Their data revealed a consistent pattern worth investigating."}],[{"type":"plain","text":"The asphalt parking lot produced some of the highest readings."},{"type":"choice","prefix":"A grassy field nearby ","correct":"was","tail":" cooler, and a shaded area beneath mature trees was cooler still.","options":["was","were","is"]},{"type":"plain","text":"Students considered several explanations for the differences."},{"type":"plain","text":"Dark pavement absorbs a large portion of incoming solar energy."},{"type":"choice","prefix":"Trees block some sunlight before ","correct":"it","tail":" reaches the ground.","options":["they","it","he"]},{"type":"choice","prefix":"Plants ","correct":"can","tail":" also release water vapor through transpiration, which contributes to cooling.","options":["could","will","can"]},{"type":"plain","text":"Wind, cloud cover, and nearby buildings can influence measurements as well."},{"type":"choice","prefix":"The class ","correct":"therefore","tail":" avoided claiming that surface type was the only factor.","options":["therefore","ordinary","unrelated"]},{"type":"choice","prefix":"Instead, ","correct":"they","tail":" described it as one important influence supported by their observations.","options":["it","they","she"]},{"type":"plain","text":"Their results matched patterns reported in research about urban heat."},{"type":"choice","prefix":"That ","correct":"connection","tail":" strengthened their explanation.","options":["ordinary","unrelated","connection"]},{"type":"plain","text":"It did not mean every city block would have identical temperatures."}],[{"type":"choice","prefix":"Urban heat ","correct":"can","tail":" affect more than comfort.","options":["can","could","will"]},{"type":"choice","prefix":"Higher temperatures ","correct":"may","tail":" increase the demand for air conditioning.","options":["might","may","can"]},{"type":"plain","text":"That demand can place additional pressure on electrical systems during heat waves."},{"type":"plain","text":"People without reliable access to cooling may face greater risks during extreme heat."},{"type":"choice","prefix":"The ","correct":"effects","tail":" are not the same in every neighborhood.","options":["ordinary","unrelated","effects"]},{"type":"plain","text":"Some areas have more tree cover, parks, or reflective surfaces than others."},{"type":"plain","text":"City planners increasingly use detailed temperature maps to identify especially hot locations."},{"type":"choice","prefix":"","correct":"Those","tail":" maps can guide decisions about planting trees or changing materials.","options":["Those","This","These"]},{"type":"plain","text":"However, each strategy has costs and limitations."},{"type":"choice","prefix":"Young trees take time to grow, and ","correct":"they","tail":" require water and maintenance.","options":["it","they","she"]},{"type":"choice","prefix":"Reflective roofs may help ","correct":"buildings","tail":" but do not solve every outdoor heat problem.","options":["ordinary","unrelated","buildings"]},{"type":"plain","text":"Effective planning often combines several approaches."}],[{"type":"plain","text":"The class invited a city forester to explain a local tree-planting program."},{"type":"choice","prefix":"","correct":"She","tail":" described how staff considered available space, water needs, power lines, and appropriate tree species.","options":["She","They","It"]},{"type":"choice","prefix":"Planting the largest possible number of trees ","correct":"was","tail":" not the only goal.","options":["were","was","is"]},{"type":"choice","prefix":"Trees ","correct":"had","tail":" to survive and fit safely into each location.","options":["has","have","had"]},{"type":"choice","prefix":"Students asked how the city ","correct":"decided","tail":" which neighborhoods received new trees first.","options":["decided","ordinary","unrelated"]},{"type":"plain","text":"The forester explained that heat data was one factor along with existing canopy, community requests, and practical planting conditions."},{"type":"plain","text":"The process involved both scientific evidence and public priorities."},{"type":"choice","prefix":"Students recognized a connection to ","correct":"their","tail":" own small investigation.","options":["his","their","our"]},{"type":"plain","text":"Their measurements could identify a pattern, but decisions required additional information."},{"type":"plain","text":"A useful solution had to consider people as well as temperature."},{"type":"choice","prefix":"The ","correct":"discussion","tail":" made the heat-island issue more complex.","options":["ordinary","unrelated","discussion"]},{"type":"plain","text":"It also showed how data can support local planning."}],[{"type":"choice","prefix":"For the final report, students created a map of ","correct":"their","tail":" measurement locations.","options":["their","his","our"]},{"type":"choice","prefix":"","correct":"They","tail":" included average temperatures rather than selecting only the hottest readings.","options":["It","They","She"]},{"type":"choice","prefix":"The report explained how pavement, shade, vegetation, and surrounding structures ","correct":"could","tail":" influence local conditions.","options":["can","would","could"]},{"type":"plain","text":"It also described limits in the class's data."},{"type":"choice","prefix":"Measurements ","correct":"covered","tail":" only a few days and a small part of the city.","options":["covered","ordinary","unrelated"]},{"type":"choice","prefix":"Students ","correct":"did","tail":" not claim that their results represented every season or neighborhood.","options":["does","did","do"]},{"type":"plain","text":"Instead, they used the project as a local example of a broader phenomenon."},{"type":"choice","prefix":"Their ","correct":"conclusions","tail":" were stronger because the limits were stated clearly.","options":["ordinary","unrelated","conclusions"]},{"type":"plain","text":"The class recommended continuing measurements during future science units."},{"type":"plain","text":"Over time, additional data could reveal whether patterns remained consistent."},{"type":"plain","text":"A hot parking lot had led them into questions about materials, ecosystems, energy, and city planning."},{"type":"plain","text":"Their final map showed how a small local study could connect to a much larger urban pattern."}]]},{"num":8,"title":"The Mystery of the Missing Bees","pages":[[{"type":"plain","text":"A community garden usually buzzed with bees throughout late spring."},{"type":"choice","prefix":"One year, ","correct":"gardeners","tail":" noticed far fewer bees visiting the flowering plants.","options":["gardeners","ordinary","unrelated"]},{"type":"choice","prefix":"","correct":"They","tail":" worried because many crops depend on animal pollinators to move pollen between flowers.","options":["It","They","She"]},{"type":"plain","text":"Without successful pollination, some plants produce fewer fruits or seeds."},{"type":"choice","prefix":"A local university researcher, Dr. Malik, agreed to help ","correct":"investigate","tail":" the change.","options":["predict","ignore","investigate"]},{"type":"choice","prefix":"","correct":"She","tail":" warned the gardeners not to assume there was one simple cause.","options":["She","They","It"]},{"type":"choice","prefix":"Bee populations ","correct":"can","tail":" be influenced by weather, habitat, disease, pesticides, and food availability.","options":["could","can","will"]},{"type":"choice","prefix":"Different bee species ","correct":"may","tail":" also respond differently to the same conditions.","options":["might","can","may"]},{"type":"plain","text":"The garden volunteers began recording which insects visited selected flowers."},{"type":"plain","text":"They observed at the same times on several days."},{"type":"plain","text":"Their records confirmed that visits were lower than in notes from previous years."},{"type":"plain","text":"The next question was why."}],[{"type":"plain","text":"Weather records provided one possible clue."},{"type":"choice","prefix":"The spring ","correct":"had","tail":" been unusually cool and rainy.","options":["had","has","have"]},{"type":"choice","prefix":"Bees ","correct":"are","tail":" generally less active during cold, wet conditions than during warm, dry weather.","options":["is","are","were"]},{"type":"choice","prefix":"Several observation days from the previous year ","correct":"had","tail":" been warmer.","options":["has","have","had"]},{"type":"choice","prefix":"That ","correct":"difference","tail":" could explain part of the decline in visits.","options":["difference","ordinary","unrelated"]},{"type":"choice","prefix":"However, weather alone ","correct":"might","tail":" not explain everything.","options":["may","might","could"]},{"type":"plain","text":"Gardeners also noticed that an empty lot nearby had recently been cleared."},{"type":"choice","prefix":"The lot had ","correct":"contained","tail":" many wildflowers and patches of bare soil.","options":["ordinary","unrelated","contained"]},{"type":"plain","text":"Some native bees nest in the ground, while others use hollow stems or small cavities."},{"type":"plain","text":"Removing vegetation can change both nesting sites and food sources."},{"type":"plain","text":"Dr. Malik suggested examining habitat changes along with weather."},{"type":"plain","text":"The investigation now included several interacting factors."}],[{"type":"choice","prefix":"The gardeners ","correct":"were","tail":" especially concerned about pesticides.","options":["were","was","are"]},{"type":"choice","prefix":"","correct":"They","tail":" reviewed products used in and around the community garden.","options":["It","They","She"]},{"type":"plain","text":"The garden itself avoided insecticides during flowering periods."},{"type":"choice","prefix":"However, volunteers ","correct":"did","tail":" not know what had been used on every nearby property.","options":["does","do","did"]},{"type":"choice","prefix":"Dr. Malik ","correct":"explained","tail":" that pesticide effects depend on the chemical, amount, timing, and route of exposure.","options":["explained","ordinary","unrelated"]},{"type":"choice","prefix":"","correct":"It","tail":" would be irresponsible to blame a particular product without evidence.","options":["They","It","He"]},{"type":"plain","text":"The team therefore recorded pesticide use only when reliable information was available."},{"type":"choice","prefix":"They also expanded their insect ","correct":"observations","tail":" to include different parts of the neighborhood.","options":["predictions","assumptions","observations"]},{"type":"plain","text":"Some locations with abundant flowers attracted more bees than the garden."},{"type":"plain","text":"Others showed similarly low activity."},{"type":"plain","text":"The mixed results suggested that no single local condition explained every observation."},{"type":"plain","text":"More data was necessary."}],[{"type":"plain","text":"As the weather became warmer and drier, bee activity increased."},{"type":"choice","prefix":"Visits at the community garden rose, although ","correct":"they","tail":" did not reach the previous year's level.","options":["they","it","she"]},{"type":"choice","prefix":"Gardeners planted additional native flowers that ","correct":"would","tail":" bloom at different times.","options":["could","would","will"]},{"type":"choice","prefix":"","correct":"They","tail":" also created small areas of undisturbed soil and left hollow stems for nesting insects.","options":["It","She","They"]},{"type":"choice","prefix":"These actions ","correct":"were","tail":" intended to improve habitat, not to prove what had caused the decline.","options":["were","was","are"]},{"type":"plain","text":"Dr. Malik continued monitoring several bee species."},{"type":"plain","text":"She found that some species became common while others remained difficult to find."},{"type":"choice","prefix":"That ","correct":"variation","tail":" mattered because “bees” are not one uniform group.","options":["similarity","variation","stability"]},{"type":"plain","text":"Different species have different nesting habits and food preferences."},{"type":"plain","text":"A habitat change may benefit one species more than another."},{"type":"choice","prefix":"The gardeners began thinking about pollinator ","correct":"diversity","tail":" rather than simply counting total bees.","options":["similarity","abundance","diversity"]},{"type":"plain","text":"The habitat improvements gave the team new conditions to observe the following year."}],[{"type":"choice","prefix":"By autumn, the investigation ","correct":"had","tail":" produced a clearer picture but not one final answer.","options":["had","has","have"]},{"type":"choice","prefix":"Cool wet ","correct":"weather","tail":" probably reduced activity early in the season.","options":["ordinary","weather","unrelated"]},{"type":"choice","prefix":"Nearby habitat loss ","correct":"may","tail":" also have affected nesting and food resources.","options":["might","can","may"]},{"type":"plain","text":"Other influences remained possible."},{"type":"choice","prefix":"Dr. Malik ","correct":"explained","tail":" that ecological questions often involve several causes operating together.","options":["explained","ordinary","unrelated"]},{"type":"plain","text":"The gardeners' response focused on actions supported by broader research: providing diverse flowers, nesting habitat, and careful pesticide practices."},{"type":"choice","prefix":"","correct":"They","tail":" planned to continue observations the following spring.","options":["It","They","She"]},{"type":"plain","text":"Long-term records would make future comparisons more reliable."},{"type":"plain","text":"The missing-bee mystery had not ended with a dramatic discovery."},{"type":"choice","prefix":"Instead, ","correct":"it","tail":" taught the community how cautious evidence can guide useful action.","options":["they","he","it"]},{"type":"plain","text":"Sometimes understanding complexity is more valuable than forcing a simple explanation."},{"type":"plain","text":"Their records would help them compare future seasons with greater confidence."}]]},{"num":9,"title":"A Constitution for a New Nation","pages":[[{"type":"plain","text":"After the American Revolution, the United States first operated under the Articles of Confederation."},{"type":"choice","prefix":"That system ","correct":"created","tail":" a national government with limited power.","options":["created","ordinary","unrelated"]},{"type":"choice","prefix":"By the 1780s, leaders disagreed about whether the government ","correct":"could","tail":" respond effectively to national problems.","options":["can","could","would"]},{"type":"plain","text":"Congress struggled to raise money, regulate trade between states, and enforce some decisions."},{"type":"choice","prefix":"States often pursued ","correct":"their","tail":" own interests.","options":["his","our","their"]},{"type":"plain","text":"In 1787, delegates from twelve states met in Philadelphia to discuss changes."},{"type":"choice","prefix":"Rhode Island ","correct":"did","tail":" not send delegates.","options":["did","does","do"]},{"type":"choice","prefix":"The ","correct":"meeting","tail":" became known as the Constitutional Convention.","options":["ordinary","meeting","unrelated"]},{"type":"plain","text":"Instead of simply revising the Articles, delegates eventually designed a new framework of government."},{"type":"choice","prefix":"","correct":"Their","tail":" debates involved representation, executive power, taxation, and the relationship between state and national authority.","options":["His","Our","Their"]},{"type":"plain","text":"Agreement was difficult because states and delegates had competing interests."},{"type":"plain","text":"The Constitution emerged through negotiation and compromise rather than complete agreement."}],[{"type":"plain","text":"One major dispute concerned representation in Congress."},{"type":"choice","prefix":"Delegates from more populous states argued that population should influence ","correct":"representation","tail":".","options":["representation","population","authority"]},{"type":"choice","prefix":"Delegates from smaller states feared that such a system would reduce ","correct":"their","tail":" influence.","options":["his","their","our"]},{"type":"plain","text":"The eventual Great Compromise created two chambers of Congress."},{"type":"choice","prefix":"In the House of Representatives, representation ","correct":"would","tail":" be based on population.","options":["could","will","would"]},{"type":"choice","prefix":"In the Senate, each state ","correct":"would","tail":" have equal representation.","options":["would","could","will"]},{"type":"choice","prefix":"","correct":"This","tail":" arrangement addressed one disagreement, but it did not make the convention fair in every respect.","options":["These","This","Those"]},{"type":"choice","prefix":"The Constitution also ","correct":"included","tail":" compromises involving slavery.","options":["ordinary","unrelated","included"]},{"type":"plain","text":"Enslaved people had no political voice in the convention, yet delegates made decisions that protected slavery and increased the political power of slaveholding states."},{"type":"plain","text":"Modern study of the Constitution therefore includes both its governmental innovations and its serious injustices."},{"type":"plain","text":"Understanding the document requires examining who participated and who was excluded."},{"type":"plain","text":"The convention's compromises had consequences that extended far beyond 1787."}],[{"type":"plain","text":"Delegates also debated how to divide government power."},{"type":"choice","prefix":"Many feared creating a national government that ","correct":"could","tail":" become too powerful.","options":["could","can","would"]},{"type":"choice","prefix":"At the same time, ","correct":"they","tail":" believed the government under the Articles had been too weak.","options":["it","they","she"]},{"type":"plain","text":"The proposed Constitution separated federal power among legislative, executive, and judicial branches."},{"type":"choice","prefix":"Each branch ","correct":"received","tail":" different responsibilities.","options":["ordinary","unrelated","received"]},{"type":"plain","text":"The system also included checks that allowed branches to limit one another in certain situations."},{"type":"plain","text":"Federalism divided authority between the national government and the states."},{"type":"choice","prefix":"","correct":"These","tail":" structures were intended to prevent power from being concentrated in one place.","options":["These","This","Those"]},{"type":"choice","prefix":"However, the exact boundaries of government authority ","correct":"have","tail":" been debated throughout U.S. history.","options":["has","have","had"]},{"type":"plain","text":"The Constitution created a framework rather than an answer to every future question."},{"type":"choice","prefix":"Courts, ","correct":"lawmakers","tail":", presidents, states, and citizens have continued interpreting its meaning.","options":["ordinary","unrelated","lawmakers"]},{"type":"plain","text":"That ongoing debate is part of the document's history."}],[{"type":"choice","prefix":"The Constitution could not take effect merely because delegates signed ","correct":"it","tail":".","options":["it","they","he"]},{"type":"choice","prefix":"","correct":"It","tail":" had to be ratified by conventions in at least nine states.","options":["They","It","He"]},{"type":"choice","prefix":"Supporters, known as Federalists, argued that the new government ","correct":"was","tail":" necessary for national stability.","options":["were","is","was"]},{"type":"plain","text":"Opponents, often called Anti-Federalists, worried about centralized power and the absence of explicit protections for individual rights."},{"type":"choice","prefix":"Newspapers and ","correct":"pamphlets","tail":" carried arguments on both sides.","options":["pamphlets","ordinary","unrelated"]},{"type":"plain","text":"The Federalist Papers defended the proposed Constitution in a series of essays."},{"type":"plain","text":"Anti-Federalist writers raised concerns that influenced the later addition of the Bill of Rights."},{"type":"choice","prefix":"Ratification debates ","correct":"were","tail":" intense and uncertain.","options":["was","were","are"]},{"type":"plain","text":"Eventually, enough states approved the Constitution for the new government to begin operating."},{"type":"plain","text":"The Bill of Rights was added soon afterward as the first ten amendments."},{"type":"choice","prefix":"Those ","correct":"amendments","tail":" protected specific liberties and addressed some objections raised during ratification.","options":["arguments","conventions","amendments"]},{"type":"plain","text":"The process showed that adopting the Constitution required continued political negotiation."}],[{"type":"plain","text":"More than two centuries later, the Constitution remains the foundation of the U.S. federal government."},{"type":"choice","prefix":"","correct":"It","tail":" has also been amended to change important parts of the original system.","options":["It","They","He"]},{"type":"plain","text":"Amendments abolished slavery, defined citizenship, expanded voting rights, and made other major changes."},{"type":"choice","prefix":"Court decisions and laws ","correct":"have","tail":" further shaped how constitutional principles operate.","options":["has","have","had"]},{"type":"choice","prefix":"The document's endurance ","correct":"does","tail":" not mean its meaning has always been uncontested.","options":["do","did","does"]},{"type":"plain","text":"Americans continue debating how its language applies to new circumstances."},{"type":"plain","text":"Historians also study the Constitution within the social and political conditions of the eighteenth century."},{"type":"choice","prefix":"That context helps explain both its innovations and its ","correct":"limitations","tail":".","options":["limitations","advantages","requirements"]},{"type":"plain","text":"For students, understanding the Constitution requires more than memorizing branches of government."},{"type":"choice","prefix":"","

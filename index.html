correct":"It","tail":" means examining debates, compromises, rights, exclusions, and changes over time.","options":["They","It","He"]},{"type":"choice","prefix":"The Constitution is both a historical document and a ","correct":"framework","tail":" still used in public life.","options":["proposal","schedule","framework"]},{"type":"plain","text":"Its history demonstrates that systems of government develop through conflict, interpretation, and revision."}]]},{"num":10,"title":"The Island Where Species Changed","pages":[[{"type":"plain","text":"In the 1830s, naturalist Charles Darwin visited the Galápagos Islands during the voyage of the HMS Beagle."},{"type":"choice","prefix":"The ","correct":"islands","tail":" lie in the Pacific Ocean west of South America.","options":["islands","ordinary","unrelated"]},{"type":"choice","prefix":"Darwin observed plants and animals that differed from species ","correct":"he","tail":" knew elsewhere.","options":["they","he","it"]},{"type":"choice","prefix":"","correct":"He","tail":" collected specimens and recorded detailed notes.","options":["They","It","He"]},{"type":"choice","prefix":"At the time, he ","correct":"did","tail":" not immediately understand the full importance of every observation.","options":["did","does","do"]},{"type":"plain","text":"Later, scientists helped identify differences among birds collected on separate islands."},{"type":"plain","text":"Those patterns contributed to Darwin's thinking about how species change over generations."},{"type":"choice","prefix":"The Galápagos ","correct":"did","tail":" not provide one sudden moment in which the entire theory appeared.","options":["does","did","do"]},{"type":"plain","text":"Instead, observations from the islands became part of a much larger body of evidence."},{"type":"plain","text":"Darwin also studied fossils, geology, domesticated animals, and species from other regions."},{"type":"choice","prefix":"Over many years, he ","correct":"developed","tail":" an explanation for evolution by natural selection.","options":["ordinary","unrelated","developed"]},{"type":"plain","text":"The theory grew from comparison, evidence, and extended reasoning."}],[{"type":"plain","text":"Natural selection depends on variation within a population."},{"type":"choice","prefix":"Individuals of the same species ","correct":"are","tail":" not completely identical.","options":["are","is","were"]},{"type":"choice","prefix":"Some variations ","correct":"can","tail":" affect how successfully organisms survive and reproduce in a particular environment.","options":["could","can","will"]},{"type":"plain","text":"If a heritable trait provides an advantage, individuals with that trait may leave more offspring on average."},{"type":"choice","prefix":"Across many ","correct":"generations","tail":", the trait can become more common in the population.","options":["locations","seasons","generations"]},{"type":"choice","prefix":"","correct":"This","tail":" process does not occur because an organism decides to change.","options":["This","These","Those"]},{"type":"plain","text":"Populations change as differences in reproductive success accumulate over time."},{"type":"choice","prefix":"The ","correct":"environment","tail":" influences which traits are advantageous under particular conditions.","options":["population","environment","community"]},{"type":"plain","text":"If conditions change, a trait that was helpful may become less useful."},{"type":"plain","text":"Natural selection therefore has no planned destination."},{"type":"choice","prefix":"","correct":"It","tail":" describes a process that can produce adaptation.","options":["They","He","It"]},{"type":"plain","text":"Understanding that distinction prevents several common misconceptions about evolution."}],[{"type":"plain","text":"Finches from the Galápagos later became a famous example in evolutionary research."},{"type":"choice","prefix":"Different populations ","correct":"have","tail":" beaks that vary in size and shape.","options":["have","has","had"]},{"type":"choice","prefix":"Beak characteristics ","correct":"can","tail":" influence which foods birds are able to use efficiently.","options":["could","can","will"]},{"type":"plain","text":"On islands where certain foods are common, particular beak forms may provide an advantage."},{"type":"choice","prefix":"Modern ","correct":"researchers","tail":" have measured changes in finch populations across generations.","options":["visitors","officials","researchers"]},{"type":"plain","text":"For example, drought can alter which seeds are available."},{"type":"plain","text":"Birds with beaks better suited to the remaining food may survive and reproduce at different rates."},{"type":"choice","prefix":"The ","correct":"population's","tail":" average traits can then shift.","options":["population's","ordinary","unrelated"]},{"type":"choice","prefix":"","correct":"These","tail":" studies provide evidence of natural selection occurring over observable periods.","options":["This","These","Those"]},{"type":"choice","prefix":"","correct":"They","tail":" also show that evolution does not always require millions of years to detect.","options":["It","She","They"]},{"type":"plain","text":"Small changes can be measured across relatively few generations."},{"type":"plain","text":"Longer periods can produce much larger differences."}],[{"type":"plain","text":"Isolation also matters on islands."},{"type":"choice","prefix":"Populations separated by water ","correct":"may","tail":" have limited opportunities to reproduce with one another.","options":["may","might","can"]},{"type":"choice","prefix":"Over many generations, separated populations ","correct":"can","tail":" accumulate different traits.","options":["could","can","will"]},{"type":"choice","prefix":"If differences become great enough, new species ","correct":"may","tail":" eventually form.","options":["might","can","may"]},{"type":"choice","prefix":"Scientists call ","correct":"this","tail":" process speciation.","options":["this","these","those"]},{"type":"plain","text":"Geographic isolation is one possible pathway, not the only one."},{"type":"plain","text":"The Galápagos Islands provide useful settings for studying how isolation and different environments interact."},{"type":"choice","prefix":"However, scientists do not rely on island ","correct":"observations","tail":" alone.","options":["predictions","observations","assumptions"]},{"type":"plain","text":"Evidence for evolution comes from genetics, fossils, anatomy, direct observations, and many other fields."},{"type":"plain","text":"Multiple independent lines of evidence support the broader theory."},{"type":"choice","prefix":"As new discoveries are made, scientists refine details while the central ","correct":"framework","tail":" remains strongly supported.","options":["proposal","schedule","framework"]},{"type":"plain","text":"Scientific theories are well-supported explanations built from extensive evidence."}],[{"type":"plain","text":"Darwin published On the Origin of Species in 1859 after decades of study."},{"type":"choice","prefix":"","correct":"His","tail":" explanation transformed biology and generated intense debate.","options":["His","Their","Our"]},{"type":"choice","prefix":"Scientific understanding ","correct":"has","tail":" expanded greatly since Darwin's lifetime.","options":["have","has","had"]},{"type":"choice","prefix":"Modern genetics explains mechanisms of inheritance that Darwin ","correct":"did","tail":" not know.","options":["does","do","did"]},{"type":"choice","prefix":"DNA ","correct":"evidence","tail":" allows researchers to compare relationships among species in ways nineteenth-century scientists could not.","options":["evidence","assumption","opinion"]},{"type":"plain","text":"Yet natural selection remains a central mechanism of evolutionary change."},{"type":"plain","text":"The Galápagos continue to support active research today."},{"type":"choice","prefix":"Scientists study ","correct":"finches","tail":", tortoises, plants, marine organisms, and changing environmental conditions.","options":["ordinary","finches","unrelated"]},{"type":"choice","prefix":"","correct":"Their","tail":" work demonstrates that scientific knowledge can grow while earlier evidence remains valuable.","options":["His","Our","Their"]},{"type":"plain","text":"Darwin's island observations mattered not because they answered every question."},{"type":"plain","text":"They helped connect patterns that required a new explanation."},{"type":"plain","text":"The continuing research shows how science advances by testing, revising, and extending ideas."}]]}]};
let grade=null,pidx=null,page=0,answers=null;
let timerSeconds=180,timerId=null,timerEndId=null,timerExpired=false,timerDeadline=0;

function stopTimer(){
  if(timerId){clearInterval(timerId);timerId=null}
  if(timerEndId){clearTimeout(timerEndId);timerEndId=null}
}
function hardStop(){
  if(timerExpired)return;
  timerExpired=true;
  timerSeconds=0;
  stopTimer();
  document.querySelectorAll('input, button.arrow').forEach(el=>el.disabled=true);
  finish();
}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return `${m}:${String(sec).padStart(2,'0')}`}
function startTimer(){
  stopTimer();
  timerSeconds=180;
  timerExpired=false;
  timerDeadline=Date.now()+180000;
  timerId=setInterval(()=>{
    timerSeconds=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));
    const el=document.getElementById('timer');
    if(el)el.textContent=formatTime(timerSeconds);
    if(Date.now()>=timerDeadline)hardStop();
  },250);
  timerEndId=setTimeout(hardStop,180000);
}
function gradeHome(){stopTimer();grade=null;pidx=null;document.getElementById('app').innerHTML=`<h1>Reading Maze Practice</h1><div class="sub">Choose your grade.</div><div class="gradegrid">${[2,3,4,5].map(g=>`<button class="grade" onclick="practiceHome(${g})"><b>${g===2?'2nd':g===3?'3rd':g+'th'} Grade</b>Reading Practice</button>`).join('')}</div>`}
function practiceHome(g){stopTimer();grade=g;pidx=null;const D=GRADES[String(g)];document.getElementById('app').innerHTML=`<button class="back" onclick="gradeHome()">← Grades</button><h1>Grade ${g} Practice</h1><div class="sub">Practices 1–10</div><div class="practicegrid">${D.map((p,i)=>`<button class="practice" onclick="start(${i})"><b>Practice ${p.num||i+1}</b><br>${p.title}</button>`).join('')}</div>`}
function start(i){
  pidx=i;page=0;
  const p=GRADES[String(grade)][pidx];
  answers=p.pages.map(pg=>Array(pg.filter(r=>r.type==='choice').length).fill(null));
  startTimer();render();
}
function render(){
  const p=GRADES[String(grade)][pidx],app=document.getElementById('app');let ci=0;
  let body=p.pages[page].map(r=>{
    if(r.type==='plain')return r.text;
    const idx=ci++;
    const opts=r.options.map((o,j)=>`<label><input type="radio" name="q${idx}" ${answers[page][idx]===j?'checked':''} onchange="pick(${idx},${j})"> ${o}</label>`).join('');
    return r.prefix+`<span class="choice">${opts}</span>`+r.tail;
  }).join(' ');
  app.innerHTML=`<button class="back" onclick="practiceHome(${grade})">← Practices</button>
  <h1>Practice ${p.num||pidx+1}</h1><div class="sub">${p.title}</div>
  <div class="timerbox"><div class="timer">Time: <span id="timer">${formatTime(Math.max(0,timerSeconds))}</span></div></div>
  <div class="story">${body}</div>
  <div class="nav"><span class="count">Page ${page+1} of ${p.pages.length}</span>
  <button class="arrow" onclick="next()">→</button></div>`;
}
function pick(i,j){if(timerExpired){hardStop();return}answers[page][i]=j}
function scorePractice(){
  const p=GRADES[String(grade)][pidx];
  let correct=0,incorrect=0,incomplete=0;
  p.pages.forEach((pg,pi)=>{
    let qi=0;
    pg.forEach(r=>{
      if(r.type!=='choice')return;
      const chosen=answers[pi][qi++];
      if(chosen===null || chosen===undefined){incomplete++;return}
      if(r.options[chosen]===r.correct)correct++;else incorrect++;
    });
  });
  return {correct,incorrect,incomplete,total:correct+incorrect+incomplete};
}
function finish(){
  stopTimer();
  const p=GRADES[String(grade)][pidx];
  const s=scorePractice();
  document.getElementById('app').innerHTML=`<div class="done"><h1>Practice Complete</h1>
  <p>You finished Practice ${p.num||pidx+1}.</p>
  <div class="results">
    <div class="result"><b>${s.correct}</b>Correct</div>
    <div class="result"><b>${s.incorrect}</b>Incorrect</div>
    <div class="result"><b>${s.incomplete}</b>Incomplete</div>
  </div>
  <p class="sub">Total choices: ${s.total}</p>
  <button class="practice" onclick="practiceHome(${grade})">Back to Grade ${grade} Practices</button></div>`;
}
function next(){
  const p=GRADES[String(grade)][pidx];
  if(page<p.pages.length-1){page++;render()}else{finish()}
}
gradeHome();
</script></body></html>
